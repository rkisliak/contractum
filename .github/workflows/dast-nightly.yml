# Nightly dynamic scans of the compose TEST stack on a GitHub runner: Schemathesis (the existing
# tests/e2e/test_phase7_schemathesis.py, which fuzzes the merged OpenAPI document of every service
# through the gateway as the Global admin and checks for 5xx and response schema conformance), then
# OWASP ZAP (baseline of the UI, API scan of the merged OpenAPI document) through
# scripts/zap-scan.sh, with the official ZAP image pinned by digest. Nothing is pushed, published
# or deployed, and no repository secret is used.
#
# scripts/zap-scan.sh reads .dev/admin_password (a throwaway value of the stack this job creates and
# destroys) only to mint the scan token. Both values are masked and never printed, and `.dev` is
# never uploaded. The artifact holds the Schemathesis log and the ZAP reports, which carry request
# and response excerpts of the throwaway stack but no credential.
#
# Ignore list for ZAP: .zap/rules.tsv, with a reason for every IGNORE. The job fails on any High
# alert that is not ignored, and on a Schemathesis failure (ZAP still runs after one). To run it by
# hand: docs/dev/ci-and-github.md.
name: DAST Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-nightly
  cancel-in-progress: false

jobs:
  # A scheduled run is skipped when main has not moved since the last green run of this workflow.
  # A manual dispatch always runs. When in doubt, test rather than skip.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether to run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running: triggered by $EVENT." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/dast-nightly.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""'); then
            echo "::warning::could not read the last green run, running the scans anyway"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running: the last green run could not be read." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: main has not moved since the last green run ($GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running: main moved since the last green run." >> "$GITHUB_STEP_SUMMARY"
          fi

  dast:
    name: dast
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker system prune -af
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # compose.test.yaml bind-mounts ./ui/test-results (long syntax, the source is not created),
      # and a runner-owned .dev makes dev-init chown its mirror files to the runner user.
      - name: Prepare bind-mount and report directories
        run: mkdir -p .dev ui/test-results .security-reports
      - name: Start the compose stack
        id: up
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Bootstrap the admin and smoke-test the stack
        run: bash scripts/skeleton-smoke.sh
      # Reuses the existing e2e module: every service's public OpenAPI through the merged
      # document, authenticated as the Global admin, with 5xx and schema conformance checks.
      - name: Schemathesis (merged OpenAPI, authenticated)
        run: |
          set -o pipefail
          bash scripts/e2e.sh tests/e2e/test_phase7_schemathesis.py 2>&1 | tee .security-reports/schemathesis.log
      # ZAP runs last: its active scan feeds the login throttle. It still runs when Schemathesis
      # failed, so one night reports both.
      - name: OWASP ZAP baseline and API scan (gate on High)
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: bash scripts/zap-scan.sh .security-reports/zap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dast-reports-${{ github.run_id }}
          path: .security-reports/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Collect compose diagnostics
        if: failure()
        run: |
          mkdir -p e2e-artifacts
          docker compose -f compose.yaml -f compose.test.yaml --profile test ps -a > e2e-artifacts/compose-ps.txt 2>&1 || true
          docker compose -f compose.yaml -f compose.test.yaml --profile test logs --no-color --timestamps > e2e-artifacts/compose-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: dast-failure-${{ github.run_id }}
          path: |
            e2e-artifacts/
            ui/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down the stack
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test down -v --remove-orphans
