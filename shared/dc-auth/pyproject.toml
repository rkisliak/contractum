[project]
name = "dc-auth"
version = "0.1.0"
description = "Shared authentication: issuer registry, JWKS cache, Principal, route policies"
requires-python = ">=3.13,<3.15"
dependencies = [
  "dc-core",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
  "cachetools>=8.0,<9",
]

[tool.uv.sources]
dc-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
