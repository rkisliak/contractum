<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Publish flow</title>
<desc id="d">A draft is published: policy and If-Match, unlocked reads, the validation gate, locks, re-checks, the write with rule pins, the outbox event, the 201 response and the notices that follow.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
</defs>
<style>
  text { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #0F172A; }
  .t { font-size: 16px; font-weight: 600; }
  .s { font-size: 13px; }
  .m { font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .num { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
  .edge { fill: none; stroke: #475569; stroke-width: 2; }
</style>
<rect x="0" y="0" width="1200" height="640" fill="#FFFFFF"/>
<text class="t" x="30" y="34" text-anchor="start">Publishing a draft: POST /api/v1/contracts/contracts/{contract_id}/drafts/{draft_id}/publish</text>
<rect x="30" y="80" width="170" height="80" rx="12" fill="#4F46E5" fill-opacity="0.10" stroke="#4F46E5" stroke-width="2"/>
<text class="t" x="44" y="104">Author</text>
<text class="s" x="44" y="125">or CI pipeline</text>
<rect x="250" y="80" width="150" height="80" rx="12" fill="#0891B2" fill-opacity="0.10" stroke="#0891B2" stroke-width="2"/>
<text class="t" x="264" y="104">Gateway</text>
<text class="s" x="264" y="125">Traefik</text>
<rect x="450" y="60" width="380" height="270" rx="12" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="2"/>
<text class="t" x="464" y="84">contracts service</text>
<text class="s" x="500" y="117" text-anchor="start">Policy contract:publish + If-Match</text>
<text class="s" x="500" y="157" text-anchor="start">Unlocked reads: bytes, rules, baseline</text>
<text class="s" x="500" y="197" text-anchor="start">Lock contract row, then draft row</text>
<text class="s" x="500" y="237" text-anchor="start">Re-check: ETag, hash, rules, SemVer,</text>
<text class="s" x="500" y="257" text-anchor="start">baseline and link facts</text>
<text class="s" x="500" y="297" text-anchor="start">Draft becomes published + rule pins</text>
<rect x="900" y="70" width="270" height="130" rx="12" fill="#059669" fill-opacity="0.10" stroke="#059669" stroke-width="2"/>
<text class="t" x="914" y="94">validation service</text>
<text class="s" x="914" y="115">publish-mode run, caller's token</text>
<text class="s" x="914" y="134">ODCS schema, mandatory and</text>
<text class="s" x="914" y="153">attached rules, breaking check</text>
<rect x="450" y="400" width="380" height="110" rx="12" fill="#475569" fill-opacity="0.10" stroke="#475569" stroke-width="2"/>
<text class="t" x="464" y="424">contracts DB (Postgres)</text>
<text class="s" x="464" y="445">contract_version row: draft to published</text>
<text class="s" x="464" y="464">outbox row, same transaction</text>
<rect x="900" y="400" width="270" height="90" rx="12" fill="#16A34A" fill-opacity="0.10" stroke="#16A34A" stroke-width="2"/>
<text class="t" x="914" y="424">NATS JetStream</text>
<text class="s" x="914" y="445">stream AUDIT, audit.contracts.></text>
<rect x="900" y="540" width="125" height="70" rx="12" fill="#D97706" fill-opacity="0.10" stroke="#D97706" stroke-width="2"/>
<text class="t" x="914" y="564">audit</text>
<text class="s" x="914" y="585">stores event</text>
<rect x="1040" y="540" width="130" height="70" rx="12" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="2"/>
<text class="t" x="1054" y="564">notices</text>
<text class="s" x="1054" y="585">consumer</text>
<rect x="30" y="400" width="380" height="210" rx="12" fill="#DC2626" fill-opacity="0.06" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="t" x="44" y="426" text-anchor="start">Failure branches (nothing is published)</text>
<text class="s" x="44" y="452" text-anchor="start">Step 3, rule or schema fails:</text>
<text class="m" x="60" y="472" text-anchor="start">422 contract-validation-failed + report</text>
<text class="s" x="44" y="498" text-anchor="start">Step 3, validation down or slow:</text>
<text class="m" x="60" y="518" text-anchor="start">503 validation-unavailable</text>
<text class="s" x="44" y="544" text-anchor="start">Step 5, changed during the gate:</text>
<text class="m" x="60" y="564" text-anchor="start">412 precondition-failed, 409 rules-changed,</text>
<text class="m" x="60" y="584" text-anchor="start">409 semver-conflict, 409 baseline-changed</text>
<path id="p1" class="edge" d="M200,110 L250,110" marker-end="url(#arr)"/>
<path id="p1b" class="edge" d="M400,110 L450,110" marker-end="url(#arr)"/>
<path id="p2" class="edge" d="M560,330 L560,398" marker-end="url(#arr)"/>
<path id="p3" class="edge" d="M830,125 L898,125" marker-end="url(#arr)"/>
