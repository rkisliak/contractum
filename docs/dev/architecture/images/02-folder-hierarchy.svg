<text x="330.0" y="224.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Organization: Finance</text>
<text x="330.0" y="242.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">org_admin granted here</text>
