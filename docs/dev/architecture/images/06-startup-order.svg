<rect x="808" y="304" width="170" height="48" rx="10" fill="#DB2777" fill-opacity="0.1" stroke="#DB2777" stroke-width="2"/><text x="893.0" y="325.0" class="t" text-anchor="middle" font-weight="600">mail</text><text x="893.0" y="343.0" class="s" text-anchor="middle">needs mailpit</text>
