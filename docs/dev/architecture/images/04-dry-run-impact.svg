<text x="304" y="434" font-size="13" fill="#475569" font-weight="400" text-anchor="start">names need contract:read-metadata</text>
<text x="304" y="452" font-size="13" fill="#475569" font-weight="400" text-anchor="start">  (otherwise counted as hidden)</text>
<text x="304" y="472" font-size="13" fill="#475569" font-weight="400" text-anchor="start">pointers need contract:read</text>
<text x="304" y="490" font-size="13" fill="#475569" font-weight="400" text-anchor="start">  (otherwise pointers_withheld)</text>
<text x="304" y="514" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">answer: items, summary,</text>
<text x="304" y="530" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">next_cursor, total_in_scope</text>
