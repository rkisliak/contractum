<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Authentication and authorization flow</title>
<desc id="d">Seven numbered steps: a request with a bearer token passes the gateway, the service authenticates it, require() asks identity, identity's gate checks the caller is live, the authorizer decides from role assignments, a denial is recorded in the outbox and relayed to audit, and the caller gets 2xx, 404, 403 or 503.</desc>
<rect x="0" y="0" width="1200" height="670" fill="#FFFFFF"/>
<defs><marker id="arrow-0F172A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker>
<marker id="arrow-7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
<marker id="arrow-DC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
<marker id="arrow-D97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
<marker id="arrow-16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
<marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="600" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">How one API call is authenticated and authorized</text>
<text x="600" y="60" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">Every service asks identity before it acts. A refusal is written to the audit trail before the answer leaves identity.</text>
<rect x="30" y="160" width="150" height="90" rx="12" fill="#4F46E5" fill-opacity="0.1" stroke="#4F46E5" stroke-width="2"/>
<text x="105.0" y="192.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Client</text>
<text x="105.0" y="210.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">user, pipeline, SDK</text>
<text x="105.0" y="228.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Bearer token</text>
<circle cx="44" cy="160" r="21" fill="#4F46E5" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.000;0.139;0.143;1.000" values="0.35;0.35;0;0"/></circle>
<circle cx="44" cy="160" r="13" fill="#4F46E5"/>
<text x="44" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
<rect x="220" y="160" width="140" height="90" rx="12" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="2"/>
<text x="290.0" y="192.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Gateway</text>
<text x="290.0" y="210.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Traefik: routes,</text>
<text x="290.0" y="228.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">TLS, rate limit</text>
<text x="290" y="274" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">no authentication here</text>
<path d="M180,205 L218,205" fill="none" stroke="#0F172A" stroke-width="2" marker-end="url(#arrow-0F172A)"/>
<path d="M360,205 L418,205" fill="none" stroke="#0F172A" stroke-width="2" marker-end="url(#arrow-0F172A)"/>
<rect x="400" y="100" width="330" height="390" rx="12" fill="#2563EB" fill-opacity="0.05" stroke="#2563EB" stroke-width="2"/>
<text x="565.0" y="300.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A"></text>
<text x="565" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Any service</text>
<text x="565" y="146" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">contracts, validation, audit, mail, identity</text>
<rect x="420" y="165" width="290" height="80" rx="12" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="2"/>
<text x="565.0" y="192.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">authenticate()</text>
<text x="565.0" y="210.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">JWT: issuer registry + JWKS key</text>
<text x="565.0" y="228.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">dcp_ token: ask identity who it is</text>
<circle cx="434" cy="165" r="21" fill="#2563EB" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.000;0.139;0.143;0.282;0.286;1.000" values="0;0;0.35;0.35;0;0"/></circle>
<circle cx="434" cy="165" r="13" fill="#2563EB"/>
<text x="434" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<rect x="420" y="280" width="290" height="75" rx="12" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="2"/>
<text x="565.0" y="304.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">require(permission, target)</text>
<text x="565.0" y="322.5" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">declared on every route</text>
<text x="565.0" y="340.5" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">of a PolicyRouter</text>
<circle cx="434" cy="280" r="21" fill="#2563EB" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.000;0.282;0.286;0.425;0.429;1.000" values="0;0;0.35;0.35;0;0"/></circle>
<circle cx="434" cy="280" r="13" fill="#2563EB"/>
<text x="434" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
<rect x="420" y="390" width="290" height="80" rx="12" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-width="2"/>
<text x="565.0" y="417.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Handler runs, or a problem</text>
<text x="565.0" y="435.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">ALLOW: 2xx  ·  NOT_FOUND: 404</text>
<text x="565.0" y="453.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">FORBIDDEN: 403  ·  no answer: 503</text>
<circle cx="434" cy="390" r="21" fill="#2563EB" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.000;0.853;0.857;1.000" values="0;0;0.35;0.35"/></circle>
<circle cx="434" cy="390" r="13" fill="#2563EB"/>
<text x="434" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">7</text>
<path d="M565,245 L565,278" fill="none" stroke="#0F172A" stroke-width="2" marker-end="url(#arrow-0F172A)"/>
<path d="M565,355 L565,388" fill="none" stroke="#0F172A" stroke-width="2" marker-end="url(#arrow-0F172A)"/>
<rect x="800" y="100" width="370" height="390" rx="12" fill="#7C3AED" fill-opacity="0.05" stroke="#7C3AED" stroke-width="2"/>
<text x="985.0" y="300.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A"></text>
<text x="985" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">identity: the decision point (PDP)</text>
<text x="985" y="146" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">POST /internal/v1/authz/check</text>
<rect x="820" y="165" width="330" height="80" rx="12" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-width="2"/>
<text x="985.0" y="192.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">PrincipalGate</text>
<text x="985.0" y="210.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">is the caller live and admitted?</text>
<text x="985.0" y="228.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Entra: Microsoft Graph via 60 s cache</text>
<circle cx="834" cy="165" r="21" fill="#7C3AED" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.000;0.425;0.429;0.567;0.571;1.000" values="0;0;0.35;0.35;0;0"/></circle>
<circle cx="834" cy="165" r="13" fill="#7C3AED"/>
<text x="834" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
<rect x="820" y="280" width="330" height="75" rx="12" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-width="2"/>
<text x="985.0" y="304.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">LocalAuthorizer decides</text>
<text x="985.0" y="322.5" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">roles on the folder and its ancestors,</text>
<text x="985.0" y="340.5" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">direct or through groups</text>
<circle cx="834" cy="280" r="21" fill="#7C3AED" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.000;0.567;0.571;0.710;0.714;1.000" values="0;0;0.35;0.35;0;0"/></circle>
<circle cx="834" cy="280" r="13" fill="#7C3AED"/>
<text x="834" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
<rect x="820" y="390" width="330" height="80" rx="12" fill="#DC2626" fill-opacity="0.08" stroke="#DC2626" stroke-width="2"/>
<text x="985.0" y="417.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Not ALLOW? Record it first</text>
<text x="985.0" y="435.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">one check.denied outbox row,</text>
<text x="985.0" y="453.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">committed before the answer</text>
<circle cx="834" cy="390" r="21" fill="#DC2626" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.000;0.710;0.714;0.853;0.857;1.000" values="0;0;0.35;0.35;0;0"/></circle>
<circle cx="834" cy="390" r="13" fill="#DC2626"/>
<text x="834" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">6</text>
<path d="M985,245 L985,278" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-7C3AED)"/>
<path d="M985,355 L985,388" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-DC2626)"/>
<path d="M710,205 L818,205" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-7C3AED)"/>
<text x="764" y="196" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">dcp_ only</text>
<path d="M710,305 L818,305" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-7C3AED)"/>
<text x="764" y="296" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">check</text>
<path d="M820,332 L712,332" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-7C3AED)"/>
<text x="764" y="350" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">decision</text>
<path d="M420,430 L105,430 L105,252" fill="none" stroke="#0F172A" stroke-width="2" marker-end="url(#arrow-0F172A)"/>
<text x="262" y="422" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">answer to the client</text>
<rect x="760" y="560" width="140" height="64" rx="12" fill="#475569" fill-opacity="0.1" stroke="#475569" stroke-width="2"/>
<text x="830.0" y="588.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Postgres</text>
<text x="830.0" y="606.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">identity DB: outbox</text>
<rect x="925" y="560" width="115" height="64" rx="12" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="2"/>
<text x="982.5" y="588.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">NATS</text>
<text x="982.5" y="606.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">AUDIT stream</text>
<rect x="1065" y="560" width="115" height="64" rx="12" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="2"/>
<text x="1122.5" y="588.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">audit</text>
<text x="1122.5" y="606.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">category denial</text>
<path d="M870,470 L840,558" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-DC2626)"/>
<path d="M900,592 L923,592" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-475569)"/>
<path d="M1040,592 L1063,592" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-16A34A)"/>
<text x="970" y="648" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">subject audit.identity.authz.check.denied (relayed after commit)</text>
<rect x="30" y="520" width="650" height="120" rx="12" fill="#94A3B8" fill-opacity="0.06" stroke="#94A3B8" stroke-width="2"/>
<text x="355.0" y="585.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A"></text>
<text x="48" y="548" text-anchor="start" font-size="15" font-weight="700" fill="#0F172A">What the caller sees</text>
<text x="48" y="574" text-anchor="start" font-size="13" font-weight="700" fill="#0F172A">ALLOW</text>
<text x="150" y="574" text-anchor="start" font-size="13" font-weight="400" fill="#475569">the handler runs and answers normally (2xx)</text>
<text x="48" y="593" text-anchor="start" font-size="13" font-weight="700" fill="#0F172A">NOT_FOUND</text>
<text x="150" y="593" text-anchor="start" font-size="13" font-weight="400" fill="#475569">404 not-found: the caller cannot even see the target, so it is hidden</text>
<text x="48" y="612" text-anchor="start" font-size="13" font-weight="700" fill="#0F172A">FORBIDDEN</text>
<text x="150" y="612" text-anchor="start" font-size="13" font-weight="400" fill="#475569">403 forbidden: the caller can see the target but may not do this</text>
<text x="48" y="631" text-anchor="start" font-size="13" font-weight="700" fill="#0F172A">unavailable</text>
<text x="150" y="631" text-anchor="start" font-size="13" font-weight="400" fill="#475569">503 service-unavailable: identity is down or the denial could not be saved</text>
<circle r="7" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0.0000;0.0183;0.0824;0.1099;0.1763;0.2107;0.2222;0.3390;0.4145;0.4420;0.4420;0.4695;0.4695;0.5461;0.6629;0.7078;0.7742;0.9185;1.0000" keyTimes="0.0000;0.0500;0.1000;0.1430;0.2000;0.2700;0.2860;0.4000;0.4200;0.4400;0.5500;0.5800;0.7000;0.7400;0.8000;0.8600;0.8800;0.9500;1.0000" path="M180,205 L220,205 L360,205 L420,205 L565,205 L565,280 L565,305 L820,305 L985,305 L985,245 L985,245 L985,305 L985,305 L820,332 L565,332 L565,430 L420,430 L105,430 L105,252"/></circle>
<circle r="6" fill="#DC2626" stroke="#FFFFFF" stroke-width="2" opacity="0"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0.0000;0.0000;0.1263;0.4520;0.5117;0.7727;1.0000;1.0000" keyTimes="0.0000;0.7150;0.7500;0.7900;0.8000;0.8300;0.8570;1.0000" path="M985,355 L985,355 L985,430 L840,558 L830,592 L985,592 L1120,592 L1120,592"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.000;0.714;0.720;0.850;0.860;1.000" values="0;0;1;1;0;0"/></circle>
