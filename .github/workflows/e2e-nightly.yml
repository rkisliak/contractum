# Nightly cold-start e2e: runs `CI_E2E=1 bash scripts/ci.sh` (or the full gate, input `full`) on
# GitHub runners, split into parallel jobs, one per part of scripts/ci.sh (CI_PART): `checks`,
# `ui-static`, `ui-e2e` (one cold stack per Playwright shard or volume project) and `py-e2e`, plus
# `operation-coverage` under the full gate. tests/repo/test_ci_parts.py checks that the jobs
# together run every step and every Playwright project. Nothing is pushed or published. It never
# prints `.dev` secrets: no step reads `.dev` except the full gate's copy of the e2e operation
# coverage report (.dev/phase7-operation-coverage.json, no secret), and no artifact holds `.dev`.
# Runner differences are handled here, so scripts/ci.sh stays runner-neutral.
name: E2E Nightly

on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full gate: bash scripts/ci.sh --full"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  # A scheduled run is skipped when main has not moved since the last green run of this workflow.
  # A manual dispatch always runs. When in doubt, test rather than skip.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether to run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running: triggered by $EVENT." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/e2e-nightly.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""'); then
            echo "::warning::could not read the last green run, running the e2e anyway"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running: the last green run could not be read." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: main has not moved since the last green run ($GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running: main moved since the last green run." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Steps 1-7 of scripts/ci.sh (7b and the coverage data under the full gate).
  checks:
    name: checks
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 120 || 75 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python from .python-version
        run: uv python install
      - name: Run the checks part
        env:
          FULL: ${{ inputs.full }}
          CI_PART: checks
        run: |
          if [ "$FULL" = "true" ]; then
            bash scripts/ci.sh --full
          else
            bash scripts/ci.sh
          fi
      # The unit and integration coverage data and operation trace, read by `operation-coverage`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.full
        with:
          name: coverage-data-${{ github.run_id }}
          path: .coverage-data/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Step 8 of scripts/ci.sh. Node and pnpm are set up so that it takes its native UI path.
  ui-static:
    name: ui-static
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Run the ui part
        env:
          FULL: ${{ inputs.full }}
          CI_PART: ui
        run: |
          if [ "$FULL" = "true" ]; then
            bash scripts/ci.sh --full
          else
            bash scripts/ci.sh
          fi

  # Step 9, UI half: every Playwright project on its own cold stack, the chromium projects in four
  # shards and each volume project (with its volume-setup dependency) on its own runner.
  ui-e2e:
    name: ui-e2e (${{ matrix.part }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: chromium-1
            args: --project=chromium --project=chromium-dark --shard=1/4
          - part: chromium-2
            args: --project=chromium --project=chromium-dark --shard=2/4
          - part: chromium-3
            args: --project=chromium --project=chromium-dark --shard=3/4
          - part: chromium-4
            args: --project=chromium --project=chromium-dark --shard=4/4
          - part: volume
            args: --project=volume
          - part: volume-dark
            args: --project=volume-dark
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker system prune -af
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # compose.test.yaml bind-mounts ./ui/test-results (long syntax, the source is not created),
      # and a runner-owned .dev makes dev-init chown its mirror files to the runner user.
      - name: Prepare bind-mount directories
        run: mkdir -p .dev ui/test-results
      - name: Run the ui-e2e part
        env:
          FULL: ${{ inputs.full }}
          CI_PART: ui-e2e
          CI_UI_E2E_ARGS: ${{ matrix.args }}
        run: |
          if [ "$FULL" = "true" ]; then
            bash scripts/ci.sh --full
          else
            bash scripts/ci.sh
          fi
      - name: Collect compose diagnostics
        if: failure()
        run: |
          mkdir -p e2e-artifacts
          docker compose -f compose.yaml -f compose.test.yaml --profile test ps -a > e2e-artifacts/compose-ps.txt 2>&1 || true
          docker compose -f compose.yaml -f compose.test.yaml --profile test logs --no-color --timestamps > e2e-artifacts/compose-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-failure-${{ github.run_id }}-ui-e2e-${{ matrix.part }}
          path: |
            e2e-artifacts/
            ui/test-results/
            ui/playwright-report/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      # The API calls of every journey, read by `operation-coverage` (its ui_e2e column).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && inputs.full
        with:
          name: ui-api-calls-${{ github.run_id }}-${{ matrix.part }}
          path: ui/test-results/**/api-calls/*.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down the stack
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test down -v --remove-orphans

  # Step 9, Python half: the whole tests/e2e suite on its own cold stack.
  py-e2e:
    name: py-e2e
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker system prune -af
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare bind-mount directories
        run: mkdir -p .dev ui/test-results
      - name: Run the py-e2e part
        env:
          FULL: ${{ inputs.full }}
          CI_PART: py-e2e
        run: |
          if [ "$FULL" = "true" ]; then
            bash scripts/ci.sh --full
          else
            bash scripts/ci.sh
          fi
      # The e2e operation coverage (written by tests/e2e/test_zz_operation_coverage.py), read by
      # `operation-coverage` (its e2e column). The only file taken from .dev; it holds no secret.
      - name: Copy the e2e operation coverage report
        if: success() && inputs.full
        run: |
          mkdir -p e2e-operation-coverage
          cp .dev/phase7-operation-coverage.json e2e-operation-coverage/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && inputs.full
        with:
          name: e2e-operation-coverage-${{ github.run_id }}
          path: e2e-operation-coverage/
          if-no-files-found: error
          retention-days: 7
      - name: Collect compose diagnostics
        if: failure()
        run: |
          mkdir -p e2e-artifacts
          docker compose -f compose.yaml -f compose.test.yaml --profile test ps -a > e2e-artifacts/compose-ps.txt 2>&1 || true
          docker compose -f compose.yaml -f compose.test.yaml --profile test logs --no-color --timestamps > e2e-artifacts/compose-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-failure-${{ github.run_id }}-py-e2e
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down the stack
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test down -v --remove-orphans

  # Step 10 of the full gate, over the data the other jobs uploaded.
  operation-coverage:
    name: operation-coverage
    needs: [checks, ui-e2e, py-e2e]
    if: inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python from .python-version
        run: uv python install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-data-${{ github.run_id }}
          path: .coverage-data
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-operation-coverage-${{ github.run_id }}
          path: .dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ui-api-calls-${{ github.run_id }}-*
          path: ui/test-results
          merge-multiple: true
      - name: Run the operation-coverage part
        env:
          CI_PART: operation-coverage
        run: bash scripts/ci.sh --full
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: operation-coverage-${{ github.run_id }}
          path: .coverage-data/operation-coverage.json
          if-no-files-found: ignore
          retention-days: 7
