<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">Container startup order</title>
<desc id="d">Six stages from left to right. 1: dev-init, plus mock-oidc, mailpit and problem-responder which need nothing. 2: postgres, nats, fake-graph, webhook-sink and traefik, after dev-init. 3: the four migrate jobs, after postgres is healthy. 4: identity. 5: contracts, validation, audit and mail, after identity is healthy. 6: api-docs, after the four public services are healthy.</desc>
<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0F172A; }
    .h { font-size: 16px; font-weight: 600; }
    .t { font-size: 14px; }
    .s { font-size: 13px; fill: #334155; }
    .flow { fill: none; stroke: #94A3B8; stroke-width: 2; marker-end: url(#arr); }
    .badge circle { fill: #0F172A; }
    .badge text { fill: #FFFFFF; font-size: 14px; font-weight: 700; text-anchor: middle; }
  </style>
<rect x="0" y="0" width="1200" height="600" fill="#FFFFFF"/>
<text x="40" y="44" class="h" style="font-size:20px">Startup order (docker compose depends_on)</text>
<text x="40" y="70" class="s">Each stage starts when the stage before it is healthy (services) or has exited successfully (one-shot jobs).</text>
<g opacity="1"><animate attributeName="opacity" values="0.12;1;1" keyTimes="0;0.07;1" dur="14.0s" repeatCount="indefinite"/>
<rect x="32" y="90" width="186" height="284" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="133.0" y="116" class="t" text-anchor="middle" font-weight="600">dev-init</text>
<rect x="40" y="130" width="170" height="48" rx="10" fill="#475569" fill-opacity="0.1" stroke="#475569" stroke-width="2"/><text x="125.0" y="151.0" class="t" text-anchor="middle" font-weight="600">dev-init</text><text x="125.0" y="169.0" class="s" text-anchor="middle">one-shot: secrets</text>
<rect x="40" y="188" width="170" height="48" rx="10" fill="#F1F5F9" fill-opacity="1" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/><text x="125.0" y="217.0" class="t" text-anchor="middle" font-weight="600">mock-oidc</text>
<rect x="40" y="246" width="170" height="48" rx="10" fill="#F1F5F9" fill-opacity="1" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/><text x="125.0" y="275.0" class="t" text-anchor="middle" font-weight="600">mailpit</text>
<rect x="40" y="304" width="170" height="48" rx="10" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="2"/><text x="125.0" y="333.0" class="t" text-anchor="middle" font-weight="600">problem-responder</text>
</g>
<g class="badge"><circle cx="34" cy="92" r="14"/><text x="34" y="97">1</text></g>
<path class="flow" d="M214,154 L222,154"/>
<g opacity="1"><animate attributeName="opacity" values="0.12;0.12;1;1" keyTimes="0;0.143;0.213;1" dur="14.0s" repeatCount="indefinite"/>
<rect x="224" y="90" width="186" height="342" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="325.0" y="116" class="t" text-anchor="middle" font-weight="600">infrastructure</text>
<rect x="232" y="130" width="170" height="48" rx="10" fill="#475569" fill-opacity="0.1" stroke="#475569" stroke-width="2"/><text x="317.0" y="151.0" class="t" text-anchor="middle" font-weight="600">postgres</text><text x="317.0" y="169.0" class="s" text-anchor="middle">Postgres 18</text>
<rect x="232" y="188" width="170" height="48" rx="10" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="2"/><text x="317.0" y="209.0" class="t" text-anchor="middle" font-weight="600">nats</text><text x="317.0" y="227.0" class="s" text-anchor="middle">JetStream</text>
<rect x="232" y="246" width="170" height="48" rx="10" fill="#F1F5F9" fill-opacity="1" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/><text x="317.0" y="275.0" class="t" text-anchor="middle" font-weight="600">fake-graph</text>
