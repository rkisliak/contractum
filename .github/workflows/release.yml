# Release of the platform: one version for the 7 server images, the Helm chart and the Python SDK
# and CLI (clients/python, package contractum: wheel, sdist and the CLI image).
#
#   Actions > Release > Run workflow (on main), mode:
#     pre-release  release candidate vX.Y.Z-rc.N of the current main HEAD
#     promote      the newest release candidate, released again as vX.Y.Z from the same commit
#
# Nobody types a version and no commit bumps one: scripts/release/next_version.py derives it from
# the Conventional Commits since the last stable tag vX.Y.Z (breaking = major, feat = minor, fix,
# perf, security, refactor, revert and dependency updates = patch; 1.0.0 first). The server images
# hold no version: services, api-docs and the UI report the one they are started with (DC_VERSION,
# DC_UI_VERSION). `helm package --version/--app-version` and `uv version` for the SDK (in its PEP
# 440 form: 1.1.0rc1 for 1.1.0-rc.1) take it at package time. The committed SDK version is the
# placeholder 0.0.0.dev0, like the chart's.
#
# Build once, test by digest, promote by digest:
#   pre-release  builds each of the 7 server images once, as <version> = X.Y.Z-rc.N, with SBOM and
#                provenance. images-manifest records their registry digests (release-images.json).
#                The full E2E (e2e-nightly.yml, full: true) and DAST (dast-nightly.yml) then run on
#                exactly those digests: the jobs pull them, start the compose stack with
#                `--no-build` and check that it runs them. Only when both passed does `tested`
#                add the result to the record (tested-images.json) and attest it. Then the chart
#                (pinned to those digests), the SDK and the CLI image are built, and last the tag
#                and the GitHub Release appear, with tested-images.json attached. A pre-release
#                creates no tag, release, chart or CLI image unless E2E and DAST passed.
#   promote      builds no server image. verify-candidate takes tested-images.json from the
#                candidate's GitHub Release (an editable asset, so it is trusted only after its
#                attestation verifies), checks its version, commit and registry, that every rc tag
#                still points at its digest and that every image attestation verifies. Any
#                missing or mismatched item stops the run before anything is published.
#                promote-images adds X.Y.Z to the same digests (imagetools create, no rebuild), so
#                the SBOM, the provenance and the attestations stay valid. The chart is repackaged
#                with the stable version and the same digests; the SDK and the CLI image are
#                rebuilt with their install and smoke tests. After the release exists, `latest`
#                is added to the same digests, so it never points at an unreleased version.
#
# Gate: the released commit must have a successful run of ci.yml, e2e-nightly.yml and
# dast-nightly.yml for that exact SHA, or the run stops and names what is missing.
#
# Outputs, all with the same version:
#   ghcr.io/<owner>/contractum/<component>:<version>   (identity, contracts, validation, audit,
#                                                       mail, api-docs, ui; the candidate's own
#                                                       images, tagged again when promoted)
#   oci://ghcr.io/<owner>/charts/contractum --version <version>
#   ghcr.io/<owner>/contractum-cli:<version>            (the CLI image; also `latest` when stable)
#   the git tag v<version> and its GitHub Release (a pre-release for -rc.N, Latest for stable),
#   with notes from scripts/release/changelog.py and attached: the chart archive, the SDK wheel
#   and sdist (contractum-<python-version>...), tested-images.json and SHA256SUMS of the four files.
#
# Attestations: each image gets a GitHub artifact attestation (build provenance, actions/attest)
# pushed next to it in the pre-release; tested-images.json, the chart archive, the wheel and the
# sdist are attested too. The wheel and the sdist are built and installed on Python 3.11 and 3.14 by
# clients/python/scripts/build_release.sh, and the CLI image runs an offline smoke before it is
# pushed. Verify with
#   gh attestation verify oci://ghcr.io/<owner>/contractum/identity:<version> --repo <owner>/contractum
#   gh attestation verify tested-images.json --repo <owner>/contractum
#   gh attestation verify contractum-<version>.tgz --repo <owner>/contractum
#   gh attestation verify contractum-<python-version>-py3-none-any.whl --repo <owner>/contractum
# The only token is the workflow's GITHUB_TOKEN. packages: write is granted only to the jobs that
# push, id-token/attestations only to the jobs that attest, contents: write only to the release
# job. The jobs that test the images get packages: read, and the registry credential is removed
# before the test stack starts. Tags it creates trigger nothing (GITHUB_TOKEN events start no
# workflow), so nothing builds twice. Pull requests and pushes to main never publish: ci.yml builds
# every image, sdk.yml dry-runs the SDK build and the CLI image (job sdk-package) and security.yml
# scans them. This workflow is the only way anything is released.
name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pre-release: a release candidate of main HEAD; promote: the newest candidate as stable"
        type: choice
        required: true
        default: pre-release
        options:
          - pre-release
          - promote

permissions:
  contents: read

# One release at a time, never cancelled half way: a second run waits.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      python-version: ${{ steps.version.outputs.python-version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      candidate: ${{ steps.version.outputs.candidate }}
      image-version: ${{ steps.version.outputs.image-version }}
      git-sha: ${{ steps.build.outputs.git-sha }}
      build-time: ${{ steps.build.outputs.build-time }}
      registry: ${{ steps.registry.outputs.registry }}
    steps:
      - name: Runs on main only
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::run the release on main, not ${REF}" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Next version
        id: version
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 scripts/release/next_version.py --mode "$MODE" --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Build identity of the released commit
        id: build
        env:
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          echo "git-sha=$(git rev-parse --short=12 "$SHA")" >> "$GITHUB_OUTPUT"
          echo "build-time=$(git log -1 --format=%cI "$SHA")" >> "$GITHUB_OUTPUT"
      - name: Registry of the platform images
        id: registry
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "registry=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: The commit passed CI, E2E Nightly and DAST Nightly
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          missing=""
          for entry in "ci.yml:Continuous Integration" "e2e-nightly.yml:E2E Nightly" "dast-nightly.yml:DAST Nightly"; do
            file="${entry%%:*}"
            title="${entry#*:}"
            count=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${file}/runs" \
              -f head_sha="$SHA" -f status=success -f per_page=1 --jq '.total_count')
            if [ "$count" = "0" ]; then
              missing="${missing}${missing:+, }${title} (${file})"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::${TAG}: commit ${SHA} has no successful run of: ${missing}. Run each one on that commit (Actions › <workflow> › Run workflow on main) and start the release again." >&2
            exit 1
          fi
          echo "${TAG} (${SHA}): CI, E2E Nightly and DAST Nightly passed." >> "$GITHUB_STEP_SUMMARY"
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          python3 scripts/release/changelog.py --version "$VERSION" --to "$SHA" \
            --since "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --server-url "$GITHUB_SERVER_URL" \
            --output release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # Pre-release only: every server image is built here, once, and never again. Promote tags these
  # same digests.
  image:
    name: image (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity
            context: .
            file: infra/docker/service.Dockerfile
            target: ""
            package: dc-identity
          - name: contracts
            context: .
            file: infra/docker/service.Dockerfile
            target: ""
            package: dc-contracts
          - name: validation
            context: .
            file: infra/docker/service.Dockerfile
            target: ""
            package: dc-validation
          - name: audit
            context: .
            file: infra/docker/service.Dockerfile
            target: ""
            package: dc-audit
          - name: mail
            context: .
            file: infra/docker/service.Dockerfile
            target: ""
            package: dc-mail
          - name: api-docs
            context: .
            file: infra/docker/api-docs.Dockerfile
            target: ""
            package: ""
          - name: ui
            context: ui
            file: infra/docker/ui.Dockerfile
            target: runtime
            package: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Image name
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.name }}
        run: echo "image=ghcr.io/${OWNER,,}/contractum/${NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          # The Dockerfiles turn these into the commit the image reports and the OCI labels
          # org.opencontainers.image.{revision,created}. The image holds no version: it is
          # given at startup, so this build is the one that is tested and then promoted.
          build-args: |
            ${{ matrix.package && format('PACKAGE={0}', matrix.package) || '' }}
            GIT_SHA=${{ needs.plan.outputs.git-sha }}
            BUILD_TIME=${{ needs.plan.outputs.build-time }}
          tags: ${{ steps.meta.outputs.image }}:${{ needs.plan.outputs.version }}
          no-cache: true
          pull: true
          push: true
          sbom: true
          provenance: mode=max
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p digest
          printf '%s\n' "$DIGEST" > "digest/${NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: digest/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io

  # The registry digests of the 7 images, read back from the registry: one record of what was built.
  images-manifest:
    name: images-manifest
    needs: [plan, image]
    if: needs.plan.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Assemble the manifest of the built images
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          GIT_SHA: ${{ needs.plan.outputs.git-sha }}
          REGISTRY: ${{ needs.plan.outputs.registry }}
        run: |
          set -euo pipefail
          python3 scripts/release/release_images.py assemble --digests digests \
            --version "$VERSION" --commit "$SHA" --git-sha "$GIT_SHA" --registry "$REGISTRY" \
            --output release-images.json
          cat release-images.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Every candidate tag resolves to its recorded digest
        env:
          DC_RELEASE_IMAGES: release-images.json
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/release/tested_images.sh verify-tags "$VERSION"
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-images
          path: release-images.json
          if-no-files-found: error
          retention-days: 7

  # The full E2E and the DAST scans run on exactly the built images (pulled by digest, started with
  # --no-build, checked before and after the tests). Their scope is that of the nightly runs.
  e2e:
    name: e2e
    needs: [plan, images-manifest]
    if: needs.plan.outputs.prerelease == 'true'
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/e2e-nightly.yml
    with:
      full: true
      release-images: release-images
      release-version: ${{ needs.plan.outputs.version }}

  dast:
    name: dast
    needs: [plan, images-manifest]
    if: needs.plan.outputs.prerelease == 'true'
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/dast-nightly.yml
    with:
      release-images: release-images
      release-version: ${{ needs.plan.outputs.version }}

  # The durable proof that these digests passed: only after both suites succeeded is the record
  # completed, and its attestation exists only then. Promote relies on it.
  tested:
    name: tested
    needs: [plan, images-manifest, e2e, dast]
    if: needs.plan.outputs.prerelease == 'true' && needs.e2e.result == 'success' && needs.dast.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-images
          path: built
      - name: Record that E2E and DAST passed on these digests
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
          DAST_RESULT: ${{ needs.dast.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/release/release_images.py record --manifest built/release-images.json \
            --run-id "$RUN_ID" --e2e "$E2E_RESULT" --dast "$DAST_RESULT" \
            --output tested-images.json
          cat tested-images.json
      - name: Attest the tested record
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: tested-images.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-images
          path: tested-images.json
          if-no-files-found: error
          retention-days: 7

  # Promote: the candidate is trusted only after everything about it checks out. Nothing is
  # published here.
  verify-candidate:
    name: verify-candidate
    needs: plan
    if: needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: The candidate is a published pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
        run: |
          set -euo pipefail
          state=$(gh release view "$CANDIDATE" --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease,isDraft --jq '"prerelease=\(.isPrerelease) draft=\(.isDraft)"')
          if [ "$state" != "prerelease=true draft=false" ]; then
            echo "::error::${CANDIDATE} is not a published pre-release (${state})" >&2
            exit 1
          fi
      - name: Download the tested record of the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
        run: |
          set -euo pipefail
          gh release download "$CANDIDATE" --repo "$GITHUB_REPOSITORY" \
            --pattern tested-images.json --dir candidate
          test -s candidate/tested-images.json
      - name: The record is for this version, commit and registry, and both suites passed
        env:
          IMAGE_VERSION: ${{ needs.plan.outputs.image-version }}
          SHA: ${{ needs.plan.outputs.sha }}
          REGISTRY: ${{ needs.plan.outputs.registry }}
        run: |
          set -euo pipefail
          python3 scripts/release/release_images.py check --manifest candidate/tested-images.json \
            --version "$IMAGE_VERSION" --commit "$SHA" --registry "$REGISTRY" --tested
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: The record and every image attestation verify
        env:
          GH_TOKEN: ${{ github.token }}
          DC_RELEASE_IMAGES: candidate/tested-images.json
        run: bash scripts/release/tested_images.sh verify-attestations
      - name: Every candidate tag still points at its tested digest
        env:
          DC_RELEASE_IMAGES: candidate/tested-images.json
          IMAGE_VERSION: ${{ needs.plan.outputs.image-version }}
        run: bash scripts/release/tested_images.sh verify-tags "$IMAGE_VERSION"
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-images
          path: candidate/tested-images.json
          if-no-files-found: error
          retention-days: 7

  # Promote: the stable tag is added to the tested digests. No server image is built here, so the
  # SBOM, the provenance and the attestations of the candidate are the stable image's too.
  promote-images:
    name: promote-images
    needs: [plan, verify-candidate]
    if: needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-images
          path: tested
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Add the stable tag to the tested digests
        env:
          DC_RELEASE_IMAGES: tested/tested-images.json
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/release/tested_images.sh tag "$VERSION"
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io

  # The images of this release exist and were tested: built and tested (pre-release) or tagged
  # (promote). The chart and the CLI image start only from here.
  images-ready:
    name: images-ready
    needs: [plan, tested, promote-images]
    if: ${{ !cancelled() && needs.plan.result == 'success' && ((needs.plan.outputs.prerelease == 'true' && needs.tested.result == 'success') || (needs.plan.outputs.prerelease == 'false' && needs.promote-images.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-images
          path: tested
      - name: The released digests
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### Images of ${VERSION}"
            echo
            echo "| image | digest |"
            echo "|---|---|"
            python3 scripts/release/release_images.py entries --manifest tested/tested-images.json \
              | while IFS=$'\t' read -r name repository digest; do
                echo "| ${repository} | ${digest} |"
              done
          } >> "$GITHUB_STEP_SUMMARY"

  # The SDK wheel and sdist, built from the released commit with the release version and attested.
  sdk:
    name: sdk
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # No Actions cache in a release job: everything is fetched fresh.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Build and check the wheel and the sdist
        env:
          PY_VERSION: ${{ needs.plan.outputs.python-version }}
        run: bash scripts/build_release.sh "$PY_VERSION"
      - name: Attest the wheel and the sdist
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: clients/python/dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-dist
          path: |
            clients/python/dist/contractum-*.whl
            clients/python/dist/contractum-*.tar.gz
            clients/python/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # The CLI image, with the same version inside (`contractum --version`) and on the tag. It is
  # smoke-tested offline first, then pushed from the same builder cache with SBOM and provenance.
  cli-image:
    name: cli-image
    needs: [plan, images-ready]
    if: ${{ !cancelled() && needs.images-ready.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Set the release version
        env:
          PY_VERSION: ${{ needs.plan.outputs.python-version }}
        run: bash scripts/build_release.sh --set-only "$PY_VERSION"
      - name: Image name
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/contractum-cli" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: clients/python
          file: clients/python/Dockerfile
          build-args: VERSION=${{ needs.plan.outputs.version }}
          tags: contractum-cli:smoke
          no-cache: true
          pull: true
          push: false
          load: true
      - name: Image reports the release version
        env:
          PY_VERSION: ${{ needs.plan.outputs.python-version }}
        run: |
          set -euo pipefail
          out=$(docker run --rm contractum-cli:smoke --version)
          echo "$out"
          [ "$out" = "contractum ${PY_VERSION}" ]
      - name: Image smoke, conforming data exits 0, non-conforming data exits 1
        run: |
          set -euo pipefail
          # The runner uses bash -e, and exit 1 is the expected result for the bad file, so each
          # exit code is captured with || to reach the assertion below.
          good=0
          docker run --rm -v "$PWD/tests/fixtures/image:/work:ro" contractum-cli:smoke \
            test orders.csv --contract payments.orders --lock contractum.lock --frozen --offline \
            || good=$?
          bad=0
          docker run --rm -v "$PWD/tests/fixtures/image:/work:ro" contractum-cli:smoke \
            test orders_bad.csv --contract payments.orders --lock contractum.lock --frozen --offline \
            || bad=$?
          echo "exit codes: conforming ${good}, non-conforming ${bad}"
          [ "$good" -eq 0 ] && [ "$bad" -eq 1 ]
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # The same inputs as the smoke build, so the builder cache gives the tested layers.
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: clients/python
          file: clients/python/Dockerfile
          build-args: VERSION=${{ needs.plan.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ needs.plan.outputs.version }}
            ${{ needs.plan.outputs.prerelease == 'false' && format('{0}:latest', steps.meta.outputs.image) || '' }}
          push: true
          sbom: true
          provenance: mode=max
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io

  # After the images are tested and tagged, so the chart never names an image that is missing or
  # untested: it pins every platform image to its tested digest.
  chart:
    name: chart
    needs: [plan, images-ready]
    if: ${{ !cancelled() && needs.images-ready.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # The official Helm release binary, pinned and checked against its published sha256.
      - name: Install Helm
        env:
          HELM_VERSION: v4.3.2
          HELM_SHA256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-bin"
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/helm-bin/helm"
          echo "$RUNNER_TEMP/helm-bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-images
          path: tested
      - name: Pin the chart to the tested digests
        env:
          IMAGE_VERSION: ${{ needs.plan.outputs.image-version }}
          SHA: ${{ needs.plan.outputs.sha }}
          REGISTRY: ${{ needs.plan.outputs.registry }}
        run: |
          set -euo pipefail
          python3 scripts/release/release_images.py check --manifest tested/tested-images.json \
            --version "$IMAGE_VERSION" --commit "$SHA" --registry "$REGISTRY" --tested
          python3 scripts/release/release_images.py pin-chart --manifest tested/tested-images.json \
            --values deploy/helm/contractum/values.yaml
      - name: Package the chart
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          REGISTRY: ${{ needs.plan.outputs.registry }}
        run: |
          set -euo pipefail
          helm version
          helm lint deploy/helm/contractum
          helm package deploy/helm/contractum --version "$VERSION" --app-version "$VERSION" \
            --destination dist
          test -f "dist/contractum-${VERSION}.tgz"
          helm template dc "dist/contractum-${VERSION}.tgz" --set "global.imageRegistry=${REGISTRY}" \
            > rendered.yaml
          python3 scripts/release/release_images.py check-rendered \
            --manifest tested/tested-images.json --version "$VERSION" --rendered rendered.yaml
      - name: Push the chart to ghcr.io
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dist/contractum-${VERSION}.tgz" "oci://ghcr.io/${OWNER,,}/charts"
      - name: Log out of ghcr.io
        if: always()
        run: helm registry logout ghcr.io || true
      - name: Attest the chart archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/contractum-${{ needs.plan.outputs.version }}.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/contractum-${{ needs.plan.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  # Last: the tag and the GitHub Release appear only when every image, the chart and the SDK files
  # are published.
  release:
    name: release
    needs: [plan, images-ready, chart, sdk, cli-image]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.images-ready.result == 'success' && needs.chart.result == 'success' && needs.sdk.result == 'success' && needs.cli-image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: chart
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-dist
          path: sdk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-images
          path: tested
      - name: Check the SDK files and write SHA256SUMS of every attached file
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PY_VERSION: ${{ needs.plan.outputs.python-version }}
        run: |
          set -euo pipefail
          (cd sdk && sha256sum -c SHA256SUMS)
          mkdir assets
          cp "chart/contractum-${VERSION}.tgz" "sdk/contractum-${PY_VERSION}-py3-none-any.whl" \
            "sdk/contractum-${PY_VERSION}.tar.gz" tested/tested-images.json assets/
          (cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          PY_VERSION: ${{ needs.plan.outputs.python-version }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::the tag ${TAG} already exists" >&2
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--latest)
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Contractum ${VERSION}" \
            --notes-file notes/release-notes.md \
            "${flags[@]}" \
            "assets/contractum-${VERSION}.tgz" \
            "assets/contractum-${PY_VERSION}-py3-none-any.whl" \
            "assets/contractum-${PY_VERSION}.tar.gz" \
            assets/tested-images.json \
            assets/SHA256SUMS

  # Promote only, and only after the release exists: `latest` is added to the tested digests, so it
  # never points at a version that was not released.
  latest:
    name: latest
    needs: [plan, release]
    if: ${{ !cancelled() && needs.plan.outputs.prerelease == 'false' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-images
          path: tested
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Point latest at the released digests
        env:
          DC_RELEASE_IMAGES: tested/tested-images.json
        run: bash scripts/release/tested_images.sh tag latest
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io
