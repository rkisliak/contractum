<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-labelledby="t d">
<title id="t">Compose network topology</title>
<desc id="d">Only Traefik publishes a host port, 8443 to 443. The edge network (172.28.0.0/24) holds Traefik at 172.28.0.10, the problem responder, api-docs and the four public services. The backend network is internal, with no outside access, and holds Postgres, NATS, mail, the migrate jobs, dev-init and the dev-only stand-ins. identity, contracts, validation, audit and api-docs are on both networks. Volumes: dev-secrets (each container mounts its own subpath at /run/secrets), pgdata for Postgres, natsdata for NATS.</desc>
<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0F172A; }
    .h { font-size: 16px; font-weight: 600; }
    .t { font-size: 14px; }
    .s { font-size: 13px; fill: #334155; }
    .flow { fill: none; stroke: #94A3B8; stroke-width: 2; marker-end: url(#arr); }
    .badge circle { fill: #0F172A; }
    .badge text { fill: #FFFFFF; font-size: 14px; font-weight: 700; text-anchor: middle; }
  </style>
<rect x="0" y="0" width="1200" height="770" fill="#FFFFFF"/>
<text x="40" y="44" class="h" style="font-size:20px">Networks, the one published port, and volumes</text>
