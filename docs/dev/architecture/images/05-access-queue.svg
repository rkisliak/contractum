<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
  <title id="t">Bounded access-event queue</title>
  <desc id="d">Contract reads add access events on the right of a bounded queue that holds at most 10,000 events. When the queue is full, adding a new event pushes the oldest one out on the left, where it is dropped and counted as queue_full. A flusher takes batches of up to 100 from the left every second, or as soon as 100 are waiting, and publishes them to the ACCESS stream.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0F172A; }
    .h { font-size: 16px; font-weight: 600; }
    .t { font-size: 14px; }
    .s { font-size: 13px; fill: #334155; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .flow { fill: none; stroke: #94A3B8; stroke-width: 2; marker-end: url(#arr); }
    .slot { fill: #2563EB; fill-opacity: 0.18; stroke: #2563EB; stroke-width: 1.5; }
    .badge circle { fill: #0F172A; }
    .badge text { fill: #FFFFFF; font-size: 14px; font-weight: 700; text-anchor: middle; }
  </style>

  <rect x="0" y="0" width="1200" height="460" fill="#FFFFFF"/>
  <text x="40" y="44" class="h" style="font-size:20px">Access events: a bounded, drop-oldest queue</text>
  <text x="40" y="70" class="s">record() never waits and never fails a read. Loss is counted, blocking is not allowed.</text>

  <!-- reads -->
  <rect x="960" y="150" width="200" height="90" rx="12" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="2"/>
  <text x="1060" y="182" class="h" text-anchor="middle">contract read</text>
  <text x="1060" y="204" class="s" text-anchor="middle">200 with content</text>
  <text x="1060" y="224" class="mono" text-anchor="middle">record()</text>

  <!-- queue frame -->
  <rect x="260" y="140" width="620" height="110" rx="14" fill="#F8FAFC" stroke="#2563EB" stroke-width="2" stroke-dasharray="0"/>
  <text x="570" y="128" class="t" text-anchor="middle" font-weight="600">deque(maxlen = 10,000): full</text>
  

  <!-- the queue contents slide left by one slot every 2 s -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;-70,0" keyTimes="0;1" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <rect class="slot" x="280" y="165" width="56" height="60" rx="8"/>
    <rect class="slot" x="350" y="165" width="56" height="60" rx="8"/>
    <rect class="slot" x="420" y="165" width="56" height="60" rx="8"/>
    <rect class="slot" x="490" y="165" width="56" height="60" rx="8"/>
    <rect class="slot" x="560" y="165" width="56" height="60" rx="8"/>
    <rect class="slot" x="630" y="165" width="56" height="60" rx="8"/>
    <rect class="slot" x="700" y="165" width="56" height="60" rx="8"/>
    <rect class="slot" x="770" y="165" width="56" height="60" rx="8"/>
    <!-- incoming slot that slides into the last place -->
    <rect class="slot" x="840" y="165" width="56" height="60" rx="8" opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- mask the frame edges so slots appear to enter and leave -->
  <rect x="0" y="150" width="258" height="90" fill="#FFFFFF"/>
  <rect x="882" y="150" width="76" height="90" fill="#FFFFFF"/>
  <path class="flow" d="M960,195 L884,195"/>
  <text x="280" y="159" class="s">oldest</text>
  <text x="866" y="159" class="s" text-anchor="end">newest</text>

  <!-- dropped oldest -->
  <g>
    <rect x="200" y="165" width="56" height="60" rx="8" fill="#DC2626" fill-opacity="0.15" stroke="#DC2626" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;1" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,90" keyTimes="0;1" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="120" y="300" width="230" height="80" rx="12" fill="#DC2626" fill-opacity="0.08" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="235" y="330" class="t" text-anchor="middle" font-weight="600">oldest dropped</text>
  <text x="235" y="352" class="mono" text-anchor="middle">reason: queue_full</text>
  <text x="235" y="370" class="s" text-anchor="middle">counted, warned every 1,000</text>
  <path class="flow" d="M228,240 L228,296"/>

  <!-- flusher -->
  <rect x="440" y="300" width="300" height="80" rx="12" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="2"/>
  <text x="590" y="330" class="t" text-anchor="middle" font-weight="600">flusher task</text>
  <text x="590" y="352" class="s" text-anchor="middle">batch ≤ 100 · every 1 s or when 100 wait</text>
  <text x="590" y="370" class="s" text-anchor="middle">10 s timeout · backoff 1 → 30 s on failure</text>
  <path class="flow" d="M300,250 C300,290 380,340 436,340"/>

  <rect x="820" y="300" width="300" height="80" rx="12" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="2"/>
  <text x="970" y="330" class="t" text-anchor="middle" font-weight="600">NATS stream ACCESS</text>
  <text x="970" y="352" class="mono" text-anchor="middle">access.contracts.contract.read</text>
  <text x="970" y="370" class="s" text-anchor="middle">publish fails: rest of batch dropped</text>
  <path class="flow" d="M740,340 L816,340"/>

  <!-- step badges -->
  <g class="badge"><circle cx="960" cy="150" r="14"/><text x="960" y="155">3</text></g>
  <g class="badge"><circle cx="120" cy="300" r="14"/><text x="120" y="305">4</text></g>
  <g class="badge"><circle cx="440" cy="300" r="14"/><text x="440" y="305">5</text></g>
  <g class="badge"><circle cx="820" cy="300" r="14"/><text x="820" y="305">6</text></g>

  <text x="40" y="430" class="s">Numbers match steps 3 to 6 of "Access events: best effort". On shutdown the queue is flushed for 2 s; the rest is dropped as shutdown.</text>
</svg>
