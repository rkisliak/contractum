[project]
name = "dc-core"
version = "0.1.0"
description = "Shared platform core: settings, DB, outbox, problem details, HTTP factory, logging"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.165.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "sqlalchemy[asyncio]>=2.1.9,<2.2",
  "psycopg[binary,pool]==3.3.9",
  "alembic==1.20.1",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "structlog==26.1.0",
  "asgi-correlation-id==5.0.1",
  "nats-py==2.16.0",
  "tenacity==9.2.1",
  "uuid-utils==1.2.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
