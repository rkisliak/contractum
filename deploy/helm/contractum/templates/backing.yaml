{{- /* Bundled backing services for evaluation: Postgres, NATS and the Mailpit catcher. */ -}}
{{- if .Values.postgres.bundled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "dc.labels" . | nindent 4 }}
data:
  10-service-databases.sh: |-
{{ .Files.Get "files/postgres/10-service-databases.sh" | indent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "dc.labels" . | nindent 4 }}
    {{- include "dc.selector" (list . "postgres") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "dc.selector" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dc.labels" . | nindent 8 }}
        {{- include "dc.selector" (list . "postgres") | nindent 8 }}
        dc.role: backing
    spec:
      # No pod calls the Kubernetes API; the token would also collide with /run/secrets.
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: POSTGRES_PASSWORD_FILE, value: /run/secrets/postgres_password}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            # TCP on purpose: the temporary init server listens on the unix socket only.
            exec: {command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"]}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: init
          configMap: {name: postgres-init}
        - name: secrets
          secret:
            secretName: {{ .Values.secrets.postgres }}
            defaultMode: 0440
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "dc.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dc.selector" (list . "postgres") | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
{{- end }}
{{- if .Values.nats.bundled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels:
    {{- include "dc.labels" . | nindent 4 }}
    {{- include "dc.selector" (list . "nats") | nindent 4 }}
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      {{- include "dc.selector" (list . "nats") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dc.labels" . | nindent 8 }}
        {{- include "dc.selector" (list . "nats") | nindent 8 }}
        dc.role: backing
    spec:
      # No pod calls the Kubernetes API; the token would also collide with /run/secrets.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: ["-c", "/run/secrets/nats.conf"]
          ports:
            - {name: client, containerPort: 4222}
            - {name: monitor, containerPort: 8222}
          readinessProbe:
            httpGet: {path: /healthz, port: monitor}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: secrets
          secret:
            secretName: {{ .Values.secrets.nats }}
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.nats.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.nats.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    {{- include "dc.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dc.selector" (list . "nats") | nindent 4 }}
  ports:
    - {name: client, port: 4222, targetPort: client}
{{- end }}
{{- if .Values.mailpit.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    {{- include "dc.labels" . | nindent 4 }}
    {{- include "dc.selector" (list . "mailpit") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dc.selector" (list . "mailpit") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dc.labels" . | nindent 8 }}
        {{- include "dc.selector" (list . "mailpit") | nindent 8 }}
        dc.role: backing
    spec:
      # No pod calls the Kubernetes API; the token would also collide with /run/secrets.
      automountServiceAccountToken: false
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          resources:
            {{- toYaml .Values.mailpit.resources | nindent 12 }}
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: http, containerPort: 8025}
          readinessProbe:
            exec: {command: ["/mailpit", "readyz"]}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    {{- include "dc.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dc.selector" (list . "mailpit") | nindent 4 }}
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: http, port: 8025, targetPort: http}
{{- end }}
