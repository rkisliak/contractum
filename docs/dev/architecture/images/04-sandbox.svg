<path d="M530,545 C450,600 300,600 140,600 L140,430" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="40" y="630" font-size="13" fill="#2563EB" font-weight="600" text-anchor="start">Report back to the caller</text>
<circle r="7" fill="#2563EB" opacity="0"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M240,155 C270,155 280,213 320,213" keyPoints="0;0;1;1" keyTimes="0;0.020;0.100;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.020;0.025;0.100;0.105;1"/></circle>
<circle r="7" fill="#2563EB" opacity="0"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M240,235 C270,235 280,259 320,259" keyPoints="0;0;1;1" keyTimes="0;0.060;0.140;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.060;0.065;0.140;0.145;1"/></circle>
<circle r="6" fill="#DC2626" opacity="0"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M240,395 C270,395 280,440 300,478" keyPoints="0;0;1;1" keyTimes="0;0.100;0.200;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.100;0.105;0.200;0.205;1"/></circle>
<circle r="7" fill="#2563EB" opacity="0"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M480,213 C512,213 520,222 520,240 L520,305 C520,315 528,320 545,320 L780,320 C850,320 840,200 900,200" keyPoints="0;0;1;1" keyTimes="0;0.160;0.280;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.160;0.165;0.280;0.285;1"/></circle>
<circle r="7" fill="#2563EB" opacity="0"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M480,259 C504,259 510,266 510,280 L510,330 C510,340 518,345 535,345 L780,345 C850,345 840,400 900,400" keyPoints="0;0;1;1" keyTimes="0;0.200;0.320;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.200;0.205;0.320;0.325;1"/></circle>
<circle r="7" fill="#059669" opacity="0"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M900,215 C870,215 870,480 800,480" keyPoints="0;0;1;1" keyTimes="0;0.360;0.460;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.360;0.365;0.460;0.465;1"/></circle>
<circle r="7" fill="#2563EB" opacity="0"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M480,259 C504,259 510,266 510,280 L510,330 C510,340 518,345 535,345 L780,345 C850,345 840,400 900,400" keyPoints="0;0;1;1" keyTimes="0;0.600;0.700;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.600;0.605;0.700;0.705;1"/></circle>
<circle r="7" fill="#059669" opacity="0"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M900,415 C870,415 870,505 800,505" keyPoints="0;0;1;1" keyTimes="0;0.720;0.800;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.720;0.725;0.800;0.805;1"/></circle>
<circle r="7" fill="#2563EB" opacity="0"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M530,545 C450,600 300,600 140,600 L140,430" keyPoints="0;0;1;1" keyTimes="0;0.840;0.960;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.840;0.845;0.960;0.965;1"/></circle>
<rect x="900" y="330" width="260" height="140" rx="12" fill="none" stroke="#D97706" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;0.3;1;0;0" keyTimes="0;0.32;0.35;0.39;0.43;0.44;1"/></rect>
<text x="40" y="664" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">1 Queue for a slot</text>
<text x="270" y="664" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">2 A worker evaluates</text>
<text x="500" y="664" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">3 The parent watches the clock</text>
<text x="730" y="664" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">4 Kill and respawn</text>
<text x="960" y="664" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">5 Results return</text>
</svg>
