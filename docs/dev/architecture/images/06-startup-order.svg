<rect x="424" y="188" width="170" height="48" rx="10" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="2"/><text x="509.0" y="217.0" class="t" text-anchor="middle" font-weight="600">contracts-migrate</text>
<rect x="424" y="246" width="170" height="48" rx="10" fill="#059669" fill-opacity="0.1" stroke="#059669" stroke-width="2"/><text x="509.0" y="275.0" class="t" text-anchor="middle" font-weight="600">validation-migrate</text>
