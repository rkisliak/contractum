# Release path of the contractum SDK and CLI (clients/python). The sdk.yml workflow tests the code;
# this one proves it can be released and, on a tag, releases it.
#
# Where a release goes (D-42): the GitHub Releases page of this repository, not a package index.
#   - The release `contractum-vX.Y.Z` carries the wheel, the sdist and SHA256SUMS. Users install the wheel
#     straight from its release URL (uv tool install / pipx install), see docs/user/sdk-cli.md.
#   - The files get GitHub artifact attestations (SLSA build provenance) through the official
#     actions/attest. Attestations on a private repository need GitHub Enterprise Cloud, so on a
#     private repository the step runs only when the repository variable SDK_ATTESTATIONS is "true".
#   - The CLI image is pushed to ghcr.io/<owner>/contractum-cli, tagged with the version and
#     `latest`, with the workflow's GITHUB_TOKEN.
#
# Every pull request touching clients/python runs build-and-smoke as a dry run: build the wheel and
# sdist, install each on the oldest and newest supported Python (3.11, 3.14) and run it, write
# SHA256SUMS, build the CLI image and run the frozen offline fixture smoke on it. Nothing is
# released from a pull request. The release jobs run only on an `contractum-v*` tag and use the very
# files build-and-smoke tested (passed on as a workflow artifact, checked against SHA256SUMS).
#
# The tag must equal the project version (`contractum-v0.1.0` for version 0.1.0): the run fails on a
# mismatch, so a released artefact always carries the version that was tested (D-06). Only official
# GitHub CLI calls (`gh release create`) create the release; no third-party release action is used.
name: sdk-release

on:
  pull_request:
    paths:
      - "clients/python/**"
      - ".github/workflows/sdk-release.yml"
  push:
    tags:
      - "contractum-v*"
  workflow_dispatch:

permissions:
  contents: read

# A pull request run is superseded by a newer push; a tag run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-smoke:
    name: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/python
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock
      - name: Project version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Tag equals the project version
        if: startsWith(github.ref, 'refs/tags/contractum-v')
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#contractum-v}"
          if [ "$tag_version" != "$PROJECT_VERSION" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match project version ${PROJECT_VERSION}" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build --clear
      - name: Wheel and sdist smoke on Python 3.11 and 3.14
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for artefact in "dist/contractum-${VERSION}-py3-none-any.whl" "dist/contractum-${VERSION}.tar.gz"; do
            for py in 3.11 3.14; do
              out=$(uv run --isolated --no-project --python "$py" --with "$artefact" contractum --version)
              echo "$artefact on python $py: $out"
              [ "$out" = "contractum ${VERSION}" ]
            done
          done
      # The SDK is Apache-2.0 (D-46): both artefacts must carry clients/python/LICENSE and NOTICE,
      # never the repository's noncommercial server licence.
      - name: Release files carry the Apache-2.0 LICENSE and NOTICE
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          wheel="dist/contractum-${VERSION}-py3-none-any.whl"
          sdist="dist/contractum-${VERSION}.tar.gz"
          info="contractum-${VERSION}.dist-info"
          unzip -p "$wheel" "${info}/METADATA" | grep -qx "License-Expression: Apache-2.0"
          unzip -p "$wheel" "${info}/licenses/LICENSE" | cmp - LICENSE
          unzip -p "$wheel" "${info}/licenses/NOTICE" | cmp - NOTICE
          tar -xzOf "$sdist" "contractum-${VERSION}/LICENSE" | cmp - LICENSE
          tar -xzOf "$sdist" "contractum-${VERSION}/NOTICE" | cmp - NOTICE
          if unzip -p "$wheel" | grep -q "Noncommercial License"; then
            echo "the wheel carries the noncommercial server licence" >&2
            exit 1
          fi
          if tar -xzOf "$sdist" | grep -q "Noncommercial License"; then
            echo "the sdist carries the noncommercial server licence" >&2
            exit 1
          fi
      - name: Write SHA256SUMS
        working-directory: clients/python/dist
        run: |
          set -euo pipefail
          sha256sum contractum-*.whl contractum-*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - name: Keep the tested release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-dist
          path: |
            clients/python/dist/contractum-*.whl
            clients/python/dist/contractum-*.tar.gz
            clients/python/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the CLI image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: clients/python
          file: clients/python/Dockerfile
          push: false
          load: true
          tags: contractum-cli:test
          cache-from: type=gha,scope=img-contractum-cli
          cache-to: type=gha,mode=max,scope=img-contractum-cli
      # The fixtures carry a lock whose hash covers the pulled contract, so --frozen --offline
      # needs no server and no credential: conforming data exits 0, the bad file exits 1.
      - name: Image smoke, conforming data exits 0
        run: |
          docker run --rm -v "$PWD/tests/fixtures/image:/work:ro" contractum-cli:test \
            test orders.csv --contract payments.orders --lock contractum.lock --frozen --offline
      - name: Image smoke, non-conforming data exits 1
        run: |
          set +e
          docker run --rm -v "$PWD/tests/fixtures/image:/work:ro" contractum-cli:test \
            test orders_bad.csv --contract payments.orders --lock contractum.lock --frozen --offline
          code=$?
          echo "exit code: $code"
          [ "$code" -eq 1 ]

  # Tag only: attest the tested files and publish them as the GitHub Release of the tag.
  # contents: write creates the release; id-token and attestations sign and store the provenance.
  github-release:
    name: github-release
    needs: build-and-smoke
    if: startsWith(github.ref, 'refs/tags/contractum-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Fetch the tested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-dist
          path: dist
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Attest build provenance
        if: ${{ !github.event.repository.private || vars.SDK_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-and-smoke.outputs.version }}
        run: |
          set -euo pipefail
          wheel="contractum-${VERSION}-py3-none-any.whl"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          cat > notes.md <<EOF
          contractum ${VERSION}: the read-only Contractum SDK and CLI (Python 3.11 to 3.14).

          Install the CLI from this release:

              uv tool install ${base}/${wheel}
              pipx install ${base}/${wheel}

          Check the download against SHA256SUMS: \`sha256sum -c SHA256SUMS --ignore-missing\`.
          Image: \`ghcr.io/${owner}/contractum-cli:${VERSION}\`.
          Guide: docs/user/sdk-cli.md.
          EOF
          prerelease=""
          case "$VERSION" in *a*|*b*|*rc*|*dev*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "contractum ${VERSION}" \
            --notes-file notes.md \
            ${prerelease:+"$prerelease"} \
            "dist/${wheel}" "dist/contractum-${VERSION}.tar.gz" dist/SHA256SUMS

  # Tag only: build and push the CLI image to GHCR. packages: write is granted here and nowhere else.
  image:
    name: image
    needs: build-and-smoke
    if: startsWith(github.ref, 'refs/tags/contractum-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the CLI image
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.build-and-smoke.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/contractum-cli"
          docker buildx build \
            --file Dockerfile \
            --build-arg "VERSION=${VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${image}:${VERSION}" \
            --tag "${image}:latest" \
            --push \
            .
