# Supply-chain policy (T-8-SC). Must exist before the first install.
# Temporarily 5 days (7200) since 2026-11-22 so eslint 10.15.0 and typescript-eslint 8.73.0 can fix
# GHSA-g3hv-75wg-m249 (minimatch); back to 14 days (20160) on 2026-11-30, when both are 14 days old.
# tests/repo/test_release_age_policy.py fails from that day until it is restored.
minimumReleaseAge: 7200 # applies to transitive packages too
blockExoticSubdeps: true
strictDepBuilds: true # install fails if any dependency has an unapproved build script

# Security overrides: transitive pins with known CVEs. Remove each once the parent ships the fix.
overrides:
  # monaco-editor 0.57.0 pins dompurify 3.4.15 (GHSA-cg2g-xh64-v4q7 CRITICAL, GHSA-mrv2-3pqr-j5jr HIGH)
  dompurify: 3.4.17
