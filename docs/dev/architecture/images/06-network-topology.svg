<rect x="20" y="150" width="1160" height="150" rx="16" fill="#0891B2" fill-opacity="0.05" stroke="#0891B2" stroke-width="2"/>
<text x="1160" y="176" class="t" font-weight="600" fill="#0E7490" text-anchor="end">edge network · 172.28.0.0/24</text>
<rect x="20" y="280" width="1160" height="340" rx="16" fill="#475569" fill-opacity="0.04" stroke="#475569" stroke-width="2" stroke-dasharray="10 5"/>
<text x="40" y="606" class="t" font-weight="600" fill="#334155">backend network · internal: true (no route to the outside)</text>
<rect x="60" y="196" width="180" height="56" rx="10" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="2"/><text x="150.0" y="221.0" class="t" text-anchor="middle" font-weight="600">traefik</text><text x="150.0" y="239.0" class="s" text-anchor="middle">172.28.0.10 · :443</text>
<rect x="270" y="196" width="180" height="56" rx="10" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="2"/><text x="360.0" y="221.0" class="t" text-anchor="middle" font-weight="600">problem-responder</text><text x="360.0" y="239.0" class="s" text-anchor="middle">:8080</text>
<path class="flow" d="M150,118 L150,192"/>
<text x="316" y="88" class="t" font-weight="600">8443 → 443</text>
<text x="316" y="108" class="s">the only published host port</text>
<text x="40" y="294" class="s">on both networks →</text>
<path d="M240,210 L255,210 L255,186 L1105,186" fill="none" stroke="#94A3B8" stroke-width="2"/>
