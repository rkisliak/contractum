<path id="p6" class="edge" d="M720,330 L720,398" marker-end="url(#arr)"/>
<path id="p7" class="edge" d="M830,445 L898,445" marker-end="url(#arr)"/>
<path id="p8" class="edge" d="M450,150 L202,150" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<path id="p9a" class="edge" d="M1000,490 L965,538" marker-end="url(#arr)"/>
<path id="p9b" class="edge" d="M1070,490 L1100,538" marker-end="url(#arr)"/>
<text class="s" x="325" y="172" text-anchor="middle">201 + ETag</text>
<text class="s" x="866" y="117" text-anchor="middle">run</text>
<text class="s" x="866" y="183" text-anchor="middle">verdict</text>
<text class="s" x="575" y="372" text-anchor="start">read</text>
<text class="s" x="735" y="372" text-anchor="start">write</text>
<text class="s" x="864" y="437" text-anchor="middle">relay</text>
