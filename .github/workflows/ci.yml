# CI only: the job-level mirror of scripts/ci.sh steps 1-8 (lint, unit, integration, ui) plus an
# image build check. Images are built but never pushed, and no registry login happens here.
# A docs-only change (scripts/ci_changes.py DOCS_PATTERNS) skips the code jobs and runs the repo
# tests only; ci-ok still reports the result.
# The cold-start e2e (scripts/ci.sh step 9) lives in e2e-nightly.yml, scanning in security.yml.
# A manual run exists for the Release gate (release.yml): a commit pushed with [skip ci] gets its
# successful CI run that way.
name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only detection (scripts/ci_changes.py classify). A change that touches only documentation
  # files skips the code jobs below and runs docs-repo-tests instead; anything else, or a change
  # whose paths cannot be listed, runs everything. Plain git diff, no third-party filter action.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          paths="$RUNNER_TEMP/changed-paths.txt"
          # A manual run (workflow_dispatch) has no base commit: the paths are unknown.
          if [ -z "$BASE_SHA" ] || ! git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" >"$paths"; then
            echo "no base commit or git diff failed: the changed paths are unknown" >&2
            rm -f "$paths"
          fi
          python3 scripts/ci_changes.py classify --paths-file "$paths"

  # On a docs-only change the repo tests still check the docs (site nav, diagrams, problem slugs,
  # portable paths, personal data); every other change runs them inside python-unit.
  docs-repo-tests:
    name: docs-repo-tests
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python from .python-version
        run: uv python install
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: repo tests
        run: uv run pytest tests/repo -m "unit and not performance" -q

  python-lint:
    name: python-lint
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python from .python-version
        run: uv python install
      - name: uv lock --check
        run: uv lock --check
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: |
          uv run mypy \
            shared/dc-core/src shared/dc-auth/src shared/dc-odcs/src shared/dc-rules/src \
            identity/src contracts/src validation/src audit/src mail/src \
            gateway/problem-responder/responder.py gateway/api-docs/merge.py gateway/api-docs/server.py \
            scripts/export_openapi.py scripts/coverage_gate.py scripts/operation_coverage.py \
            scripts/gen_http_reference.py scripts/release/next_version.py scripts/release/changelog.py \
            scripts/ci_changes.py
      - name: lint-imports
        run: uv run lint-imports

  python-unit:
    name: python-unit
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: tests/repo/test_no_personal_data.py reads every author email.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python from .python-version
        run: uv python install
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: unit tests
        run: uv run pytest -m "unit and not performance" -q

  python-integration:
    name: python-integration
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python from .python-version
        run: uv python install
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: integration tests (the runner's Docker daemon serves testcontainers)
        run: uv run pytest -m "integration and not performance" -q

  ui:
    name: ui
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm must be set up before setup-node so that setup-node can use the pnpm cache.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Check the pinned toolchain
        run: |
          want_node="v$(tr -d '[:space:]' <ui/.nvmrc)"
          if [ "$(node --version)" != "$want_node" ]; then
            echo "node $(node --version) is not the pinned $want_node" >&2
            exit 1
          fi
          if [ "$(pnpm --version)" != "12.17.0" ]; then
            echo "pnpm $(pnpm --version) is not the pinned 12.17.0" >&2
            exit 1
          fi
      - name: pnpm install --frozen-lockfile
        run: pnpm --dir ui install --frozen-lockfile
      - name: pnpm ci:static (generated client drift, lint, types, unit tests, build)
        run: pnpm --dir ui ci:static

  docker-build:
    name: docker-build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity
            context: .
            file: infra/docker/service.Dockerfile
            target: ""
            build-args: PACKAGE=dc-identity
          - name: contracts
            context: .
            file: infra/docker/service.Dockerfile
            target: ""
            build-args: PACKAGE=dc-contracts
          - name: validation
            context: .
            file: infra/docker/service.Dockerfile
            target: ""
            build-args: PACKAGE=dc-validation
          - name: audit
            context: .
            file: infra/docker/service.Dockerfile
            target: ""
            build-args: PACKAGE=dc-audit
          - name: mail
            context: .
            file: infra/docker/service.Dockerfile
            target: ""
            build-args: PACKAGE=dc-mail
          - name: api-docs
            context: .
            file: infra/docker/api-docs.Dockerfile
            target: ""
            build-args: ""
          - name: ui
            context: ui
            file: infra/docker/ui.Dockerfile
            target: runtime
            build-args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          push: false
          cache-from: type=gha,scope=img-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=img-${{ matrix.name }}

  # The one required check. scripts/ci_changes.py verdict: every job that should have run must
  # succeed; a code job may be skipped only on a docs-only change, docs-repo-tests only on any
  # other change. A failed, cancelled or unexpectedly skipped job fails ci-ok.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, docs-repo-tests, python-lint, python-unit, python-integration, ui, docker-build]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Summarise the results
        env:
          NEEDS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: python3 scripts/ci_changes.py verdict --needs "$NEEDS" --docs-only "$DOCS_ONLY"
