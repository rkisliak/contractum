<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Folder hierarchy and inherited grants</title>
<desc id="d">A folder tree ROOT, two Organizations, Projects and Teams. A grant at the Finance Organization flows down to its Projects and Teams; it never reaches ROOT or the sibling Marketing Organization.</desc>
<rect x="0" y="0" width="1200" height="640" fill="#FFFFFF"/>
<defs><marker id="arrow-7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
<marker id="arrow-DC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
<marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Grants flow down the folder tree, never up or sideways</text>
<text x="600" y="58" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">Example: the group finance-admins holds org_admin on the Finance Organization.</text>
