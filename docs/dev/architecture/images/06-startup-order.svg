<rect x="616" y="130" width="170" height="48" rx="10" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="2"/><text x="701.0" y="151.0" class="t" text-anchor="middle" font-weight="600">identity</text><text x="701.0" y="169.0" class="s" text-anchor="middle">issues and checks</text>
</g>
