# Release path of the server: builds the 7 platform images and publishes them to GitHub Container
# Registry, where the Helm chart pulls them from by default (global.imageRegistry ghcr.io/rkisliak).
#
#   ghcr.io/<owner>/contractum/<component>:<version>
#   (identity, contracts, validation, audit, mail, api-docs, ui)
#
# It runs only on a server release tag `vX.Y.Z` (or by hand on such a tag, to publish it again). The
# tag must equal `appVersion` in deploy/helm/contractum/Chart.yaml, so the chart's default image tag
# (its appVersion) always names images that exist. Pull requests and pushes to main never publish:
# ci.yml builds every image and security.yml scans them.
#
# Each image is built from scratch (no build cache) with BuildKit SBOM and SLSA provenance
# (mode=max) attestations attached in the registry, and gets a GitHub artifact attestation (build
# provenance, actions/attest) pushed next to it. Verify one with
#   gh attestation verify oci://ghcr.io/<owner>/contractum/identity:<version> --repo <owner>/contractum
# The only token is the workflow's GITHUB_TOKEN; packages: write is granted to the image job only.
name: release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

# A release is never cancelled half way; a second run of the same tag waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag equals the chart appVersion
        id: version
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v[0-9]*) ;;
            *) echo "::error::release runs only on a vX.Y.Z tag, not ${GITHUB_REF}" >&2; exit 1 ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag ${GITHUB_REF_NAME} is not vX.Y.Z" >&2
            exit 1
          fi
          app_version=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' deploy/helm/contractum/Chart.yaml)
          if [ "$version" != "$app_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the chart appVersion ${app_version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  image:
    name: image (${{ matrix.name }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity
            context: .
            file: infra/docker/service.Dockerfile
            target: ""
            package: dc-identity
          - name: contracts
            context: .
            file: infra/docker/service.Dockerfile
            target: ""
            package: dc-contracts
          - name: validation
            context: .
            file: infra/docker/service.Dockerfile
            target: ""
            package: dc-validation
          - name: audit
            context: .
            file: infra/docker/service.Dockerfile
            target: ""
            package: dc-audit
          - name: mail
            context: .
            file: infra/docker/service.Dockerfile
            target: ""
            package: dc-mail
          - name: api-docs
            context: .
            file: infra/docker/api-docs.Dockerfile
            target: ""
            package: ""
          - name: ui
            context: ui
            file: infra/docker/ui.Dockerfile
            target: runtime
            package: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name and build metadata
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${OWNER,,}/contractum/${NAME}" >> "$GITHUB_OUTPUT"
          echo "git-sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build-time=$(git log -1 --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: |
            ${{ matrix.package && format('PACKAGE={0}', matrix.package) || '' }}
            GIT_SHA=${{ steps.meta.outputs.git-sha }}
            BUILD_TIME=${{ steps.meta.outputs.build-time }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.image }}:${{ needs.version.outputs.version }}
          no-cache: true
          pull: true
          push: true
          sbom: true
          provenance: mode=max
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io
