<text x="330" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<circle cx="730" cy="262" r="13" fill="#DC2626"/>
<text x="730" y="267" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
<circle r="6" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0.0000;0.0000;1.0000;1.0000" keyTimes="0.0000;0.0600;0.1700;1.0000" path="M330,256 L330,256 L200,320 L200,320"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.000;0.060;0.065;0.170;0.180;1.000" values="0;0;1;1;0;0"/></circle>
