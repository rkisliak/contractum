# SonarQube Cloud analysis settings, read by the `sonarqube` job of .github/workflows/security.yml.
# PREPARED BUT INACTIVE: the job runs only when the repository variable SONAR_ENABLED is 'true'.
# Activation steps: docs/dev/ci-and-github.md ("SonarQube Cloud activation").
#
# sonar.organization and sonar.projectKey are deliberately not set here: the job passes them from
# the repository variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY, so nothing in git names the
# account. The token is the repository secret SONAR_TOKEN, never a file.

# Sources: every service, every shared library, the data-engineer SDK (clients/python) and the UI.
# Python tests live in a tests dir next to
# each package (and in the root tests dir). UI unit tests sit next to their sources, so ui/src is
# both a source and a test directory, and the test files are split off by the two patterns below.
sonar.sources=audit/src,contracts/src,identity/src,mail/src,validation/src,shared/dc-auth/src,shared/dc-core/src,shared/dc-odcs/src,shared/dc-rules/src,clients/python/src,ui/src
sonar.tests=audit/tests,contracts/tests,identity/tests,mail/tests,validation/tests,shared/dc-auth/tests,shared/dc-core/tests,shared/dc-odcs/tests,shared/dc-rules/tests,clients/python/tests,tests,ui/e2e,ui/src
sonar.test.inclusions=**/tests/**,ui/e2e/**,ui/src/**/*.test.ts,ui/src/**/*.test.tsx,ui/src/test/**

# Not analysed: test files that live inside ui/src (counted as tests above), generated code, the
# committed OpenAPI snapshot, the vendored ODCS JSON Schemas, the SDK's vendored generated client and
# pruned OpenAPI snapshot, and installed packages.
sonar.exclusions=ui/src/**/*.test.ts,ui/src/**/*.test.tsx,ui/src/test/**,ui/src/api/schema.gen.ts,ui/src/routeTree.gen.ts,ui/openapi/**,shared/dc-odcs/src/dc_odcs/schemas/**,clients/python/src/contractum/_generated/**,clients/python/openapi/**,**/node_modules/**

# Alembic migrations repeat the same boilerplate by design: keep them out of duplication metrics.
sonar.cpd.exclusions=**/migrations/versions/**

sonar.python.version=3.14

# Coverage produced by the job: pytest-cov XML for Python, vitest lcov for the UI.
# The SDK report (clients/python/coverage.xml) is unit plus integration runs combined, as for the
# server (D-48); clients/python/scripts/combined_coverage.sh writes it with repository-root paths.
sonar.python.coverage.reportPaths=coverage.xml,clients/python/coverage.xml
sonar.javascript.lcov.reportPaths=ui/coverage/lcov.info
