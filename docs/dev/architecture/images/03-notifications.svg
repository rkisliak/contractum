<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d">
<title id="t">Card notifications</title>
<desc id="d">A lifecycle event travels from the contracts outbox through NATS to the notice consumer, becomes card notices and deliveries, and the delivery worker sends a signed webhook or asks the mail service to send an email. The sunset scheduler adds notices directly.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
</defs>
<style>
  text { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #0F172A; }
  .t { font-size: 16px; font-weight: 600; }
  .s { font-size: 13px; }
  .m { font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .num { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
  .edge { fill: none; stroke: #475569; stroke-width: 2; }
</style>
<rect x="0" y="0" width="1200" height="660" fill="#FFFFFF"/>
<text class="t" x="30" y="34" text-anchor="start">Card notices: from a lifecycle event to a webhook or an email</text>
<rect x="30" y="60" width="250" height="90" rx="12" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="2"/>
<text class="t" x="44" y="84">contracts API</text>
<text class="s" x="44" y="105">publish, promote, deprecate,</text>
<text class="s" x="44" y="124">blocked unpublish, pin removed</text>
<rect x="30" y="250" width="250" height="190" rx="12" fill="#475569" fill-opacity="0.10" stroke="#475569" stroke-width="2"/>
<text class="t" x="44" y="274">contracts DB</text>
<text class="m" x="44" y="300" text-anchor="start">outbox</text>
<text class="m" x="44" y="340" text-anchor="start">card_notice</text>
<text class="s" x="44" y="362" text-anchor="start">  one per card and event</text>
<text class="m" x="44" y="395" text-anchor="start">card_notice_delivery</text>
<text class="s" x="44" y="417" text-anchor="start">  one per enabled channel</text>
<rect x="30" y="520" width="250" height="90" rx="12" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="2"/>
<text class="t" x="44" y="544">sunset scheduler</text>
<text class="s" x="44" y="565">lock dc-card-sunset,</text>
<text class="s" x="44" y="584">30 and 7 days before sunset</text>
<rect x="360" y="60" width="200" height="90" rx="12" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="2"/>
<text class="t" x="374" y="84">outbox relay</text>
<text class="s" x="374" y="105">publishes unsent rows</text>
<rect x="640" y="60" width="260" height="90" rx="12" fill="#16A34A" fill-opacity="0.10" stroke="#16A34A" stroke-width="2"/>
<text class="t" x="654" y="84">NATS JetStream</text>
<text class="s" x="654" y="105">stream AUDIT</text>
<text class="s" x="654" y="124">audit.contracts.></text>
<rect x="640" y="250" width="260" height="100" rx="12" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="2"/>
<text class="t" x="654" y="274">notice consumer</text>
<text class="s" x="654" y="295">durable contracts-notices</text>
<text class="s" x="654" y="314">dedupe key per card and event</text>
<rect x="360" y="440" width="240" height="110" rx="12" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="2"/>
<text class="t" x="374" y="464">delivery worker</text>
<text class="s" x="374" y="485">CardNotifier, lock dc-card-notifier</text>
<text class="s" x="374" y="504">SKIP LOCKED claim and lease</text>
<text class="s" x="374" y="523">retries with backoff</text>
<rect x="940" y="330" width="230" height="100" rx="12" fill="#4F46E5" fill-opacity="0.10" stroke="#4F46E5" stroke-width="2"/>
<text class="t" x="954" y="354">Card webhook URL</text>
<text class="s" x="954" y="375">Standard Webhooks, signed</text>
<text class="s" x="954" y="394">SSRF check on every try</text>
<rect x="940" y="470" width="230" height="80" rx="12" fill="#DB2777" fill-opacity="0.10" stroke="#DB2777" stroke-width="2"/>
<text class="t" x="954" y="494">mail service</text>
<text class="s" x="954" y="515">/internal/v1/mail/send</text>
<rect x="940" y="580" width="230" height="60" rx="12" fill="#94A3B8" fill-opacity="0.10" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5"/>
<text class="t" x="954" y="604">SMTP server</text>
<text class="s" x="954" y="625">dev: Mailpit</text>
<text class="s" x="1170" y="450" text-anchor="end" style="fill:#64748B">dev: webhook-sink</text>
