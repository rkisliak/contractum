{{- if .Values.gateway.enabled }}
{{- /*
Traefik with the same static and dynamic configuration as docker compose (copied into files/gateway
and kept identical by tests/repo/test_helm_chart_sync.py). The routers address the services by
their fixed Service names. The TLS certificate comes from the kubernetes.io/tls Secret, mounted
at /run/secrets as tls.crt and tls.key (the paths gateway/dynamic/tls.yml expects).
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-static
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "dc.labels" . | nindent 4 }}
data:
  {{- /*
  The one difference from compose: Traefik runs as a non-root user here, so the websecure
  entry point listens on 8443 and the Service maps port 443 to it.
  */}}
  {{- $static := .Files.Get "files/gateway/traefik.yml" | replace "address: \":443\"" "address: \":8443\"" }}
  {{- if not (contains "address: \":8443\"" $static) }}
  {{- fail "files/gateway/traefik.yml: the websecure entry point is no longer :443, update gateway.yaml" }}
  {{- end }}
  traefik.yml: |-
{{ $static | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-dynamic
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "dc.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "files/gateway/dynamic/*.yml" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "dc.labels" . | nindent 4 }}
    {{- include "dc.selector" (list . "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "dc.selector" (list . "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dc.labels" . | nindent 8 }}
        {{- include "dc.selector" (list . "gateway") | nindent 8 }}
        dc.role: gateway
      annotations:
        checksum/static: {{ .Files.Get "files/gateway/traefik.yml" | sha256sum }}
    spec:
      # No pod calls the Kubernetes API; the token would also collide with /run/secrets.
      automountServiceAccountToken: false
      # Non-root on unprivileged ports (websecure 8443, ping 8080); fsGroup lets the user read the
      # group-readable TLS Secret.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: traefik
          image: {{ .Values.gateway.image }}
          args: ["--configFile=/etc/traefik/traefik.yml"]
          ports:
            - {name: websecure, containerPort: 8443}
            - {name: ping, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /ping, port: ping}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /ping, port: ping}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - {name: static, mountPath: /etc/traefik/traefik.yml, subPath: traefik.yml, readOnly: true}
            - {name: dynamic, mountPath: /etc/traefik/dynamic, readOnly: true}
            - {name: tls, mountPath: /run/secrets, readOnly: true}
            # Traefik's buffering middleware (body-limit) spills responses over 1 MiB to /tmp;
            # without a writable /tmp on this read-only root filesystem they fail with a 500.
            - {name: tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: static
          configMap: {name: gateway-static}
        - name: dynamic
          configMap: {name: gateway-dynamic}
        - name: tls
          secret:
            secretName: {{ .Values.secrets.gatewayTls }}
            defaultMode: 0440
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "dc.labels" . | nindent 4 }}
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "dc.selector" (list . "gateway") | nindent 4 }}
  ports:
    - {name: https, port: {{ .Values.gateway.service.port }}, targetPort: websecure}
{{- end }}
