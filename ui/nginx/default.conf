# The ui server block (D-UI-08-04, D-UI-08-07). Baked into the image; the three included files are
# written at container start by /docker-entrypoint.d/40-ui-config.sh into /tmp/ui (a tmpfs).
#
# add_header inheritance: a location that declares any add_header drops every server-level one, so
# the security header file is included in the server block and again in every location. Security
# headers carry `always` (they must land on 404 and 405 too). The immutable Cache-Control must not
# carry `always`, or a missing hashed asset would be cached for a year (A-8).
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  include /tmp/ui/headers.conf;

  location = /config.json {
    alias /tmp/ui/config.json;
    add_header Cache-Control "no-store" always;
    include /tmp/ui/headers.conf;
  }

  location = /healthz.txt {
    add_header Cache-Control "no-store" always;
    include /tmp/ui/headers.conf;
  }

  # The MSAL redirect bridge page arrives in a later plan; its header set differs only by
  # frame-ancestors 'self' and no Cross-Origin-Opener-Policy (A-4, A-7).
  location = /redirect.html {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    include /tmp/ui/headers-bridge.conf;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /tmp/ui/headers.conf;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store" always;
    include /tmp/ui/headers.conf;
  }
}
