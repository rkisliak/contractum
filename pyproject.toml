# Virtual uv workspace root (no [project] table). One uv.lock for the whole platform.

[tool.uv.workspace]
members = ["shared/*", "identity", "contracts", "validation", "audit", "mail"]
exclude = ["clients/*"]

[tool.uv.sources]
dc-core = { workspace = true }
dc-auth = { workspace = true }
dc-odcs = { workspace = true }
dc-rules = { workspace = true }
dc-identity = { workspace = true }
dc-contracts = { workspace = true }
dc-validation = { workspace = true }
dc-audit = { workspace = true }
dc-mail = { workspace = true }

[dependency-groups]
dev = [
  "dc-core",
  "dc-auth",
  "dc-odcs",
  "dc-rules",
  "dc-identity",
  "dc-contracts",
  "dc-validation",
  "dc-audit",
  "dc-mail",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "testcontainers==4.15.0",
  "respx==0.23.1",
  "hypothesis==6.170.15",
  "ruff==0.17.5",
  "mypy==2.4.1",
  "import-linter==2.17",
  "httpx==0.28.1",
  "schemathesis==4.33.4",
  "pytest-cov==7.1.0",
  "coverage==7.17.3",
]
# Docs site build and spell check (zensical + mkdocstrings for the site, typos for the docs CI job).
# Not part of any default sync: run it with `uv run --group docs ...`.
docs = [
  "zensical==0.1.3",
  "mkdocstrings-python==2.0.11",
  "typos==1.52.2",
]
e2e = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.15.1",
  "docker>=7.1",
  "schemathesis==4.33.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# importlib mode: several modules have identically named test files.
addopts = "--import-mode=importlib -ra --strict-markers -m 'not oracle'"
testpaths = ["shared", "identity", "contracts", "validation", "audit", "mail", "tests"]
markers = [
  "unit: fast tests, no Docker daemon required",
  "integration: needs a running Docker daemon (testcontainers)",
  "e2e: needs the docker compose stack",
  "timing: CPU or wall-clock budget sensitive; the full gate runs these without coverage tracing",
  "oracle: dev-only datacontract-cli agreement check (network, never in CI)",
  "performance: load, throughput or scale budget; skipped by scripts/ci.sh and scripts/e2e.sh unless DC_PERFORMANCE=1 (the dev hardware cannot hold it)",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["clients"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

# types-PyYAML is deliberately not in the lock (no package beyond the approved set); PyYAML is
# only used behind dc_odcs.loader / dc_odcs.gate.
[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

# cel-expr-python ships no stubs or py.typed marker; it is imported only by dc_rules.cel_engine.
[[tool.mypy.overrides]]
module = ["cel_expr_python", "cel_expr_python.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = [
  "dc_core",
  "dc_auth",
  "dc_odcs",
  "dc_rules",
  "dc_identity",
  "dc_contracts",
  "dc_validation",
  "dc_audit",
  "dc_mail",
]

[[tool.importlinter.contracts]]
name = "Services are independent of each other"
type = "independence"
modules = ["dc_identity", "dc_contracts", "dc_validation", "dc_audit", "dc_mail"]

[[tool.importlinter.contracts]]
name = "Shared libraries never import services"
type = "forbidden"
source_modules = ["dc_core", "dc_auth", "dc_odcs", "dc_rules"]
forbidden_modules = ["dc_identity", "dc_contracts", "dc_validation", "dc_audit", "dc_mail"]

[[tool.importlinter.contracts]]
name = "dc_rules is pure"
type = "forbidden"
source_modules = ["dc_rules"]
forbidden_modules = [
  "dc_core",
  "dc_auth",
  "dc_odcs",
  "dc_identity",
  "dc_contracts",
  "dc_validation",
  "dc_audit",
  "dc_mail",
]

[[tool.importlinter.contracts]]
name = "The validation web process never loads the rule engine"
type = "forbidden"
source_modules = ["dc_validation"]
forbidden_modules = [
  "dc_rules.cel_engine",
  "dc_rules.targets",
  "dc_rules.evaluator",
  "dc_rules.worker",
]

# Line and branch coverage (pytest-cov). Measured by `CI_FULL=1 bash scripts/ci.sh`; thresholds per
# package are enforced by scripts/coverage_gate.py from [tool.dc-coverage.thresholds] below.
[tool.coverage.run]
branch = true
source_pkgs = [
  "dc_core",
  "dc_auth",
  "dc_odcs",
  "dc_rules",
  "dc_identity",
  "dc_contracts",
  "dc_validation",
  "dc_audit",
  "dc_mail",
]
# Each service's Alembic directory (env.py and versions/) has no __init__.py and Alembic loads
# its files by path under generated module names, so source_pkgs never matches them: they ran in
# the migration tests but were reported nowhere, while SonarQube counted every line as uncovered.
# source_dirs matches by file path and measures them like the rest of the package.
source_dirs = [
  "audit/src/dc_audit/migrations",
  "contracts/src/dc_contracts/migrations",
  "identity/src/dc_identity/migrations",
  "validation/src/dc_validation/migrations",
]
# The rule worker subprocesses (`python -m dc_rules.worker`) are deliberately NOT traced: tracing
# slows each evaluation past the CPU and check budgets the integration tests rely on (rule-set
# publishes failed with 422 under load). dc_rules.worker is measured in-process by its unit tests.
# SQLAlchemy's asyncio layer runs ORM code inside greenlets: without this, every line after the
# first awaited query in a unit of work is reported as missed.
concurrency = ["thread", "greenlet"]
data_file = ".coverage-data/.coverage"
# Paths stored relative to the repo root, so coverage.xml maps in SonarQube no matter where the
# scanner mounts the checkout (CI runner, sonar-scanner-cli container).
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "\\.\\.\\.$",
]

# Combined line+branch floor per workspace member, enforced by scripts/coverage_gate.py in the
# full gate (CI_FULL=1 bash scripts/ci.sh). Print the measured table with
# `uv run python scripts/coverage_gate.py --markdown`.
[tool.dc-coverage.thresholds]
# Measured 2026-11-21 (quick 261121-bvy, unit + integration), rounded down to one decimal. The
# three packages newly at 100.0 keep 99.9 so one timing-dependent branch of their async loops
# (relay, JWKS refresh, consumer back-off) cannot fail the gate on its own; mail was 100.0 before.
"identity" = 99.1
"contracts" = 99.4
"validation" = 99.8
"audit" = 99.9
"mail" = 100.0
"shared/dc-core" = 99.9
"shared/dc-auth" = 99.9
"shared/dc-odcs" = 99.9
"shared/dc-rules" = 99.8
