[project]
name = "dc-odcs"
version = "0.1.0"
description = "ODCS support: vendored JSON Schemas, parsing and structural validation"
requires-python = ">=3.13,<3.15"
dependencies = [
  "jsonschema-rs==0.61.2",
  "pyyaml==6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
