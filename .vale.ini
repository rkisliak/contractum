# Vale prose linter for the Contractum docs (docs/**/*.md and the READMEs).
#
# scripts/docs_gate.py runs it on the changed docs (git hooks and the docs-gate CI job) and on every
# doc with --all. It uses Vale 3.28.1: the release binary as `vale` on PATH, or the official image
# pinned by digest. To run it by hand from the repository root:
#   python3 scripts/docs_gate.py --sync      # once: download the packages below, SHA-256 checked
#   vale --no-global docs README.md
#   docker run --rm -v "$PWD:/repo:ro" -w /repo jdkato/vale:v3.28.1@sha256:42b74f7f3ea7dd60554181037a8899a190516b9d48b67d157b09e5df791f9115 --no-global docs README.md
#
# Only `error` alerts make Vale exit 1. Errors are kept to rules that are precise (stale release
# claims, internal ids, the old product name). Everything taste-based is a warning or a suggestion:
# printed for the writer, never blocking. Do not turn a rule off to pass a run; fix the text, or add
# a real term to the vocabulary (styles/config/vocabularies/Contractum/accept.txt).
#
# `python3 scripts/docs_gate.py --sync` downloads the packages below into .vale/styles/Google and
# .vale/styles/write-good (both git-ignored) and refuses a zip whose SHA-256 differs from its pin
# (Vale 3.28 does not check the #sha256 pin itself; use the script, not `vale sync`). It never
# touches .vale/styles/Contractum or .vale/styles/config, which are committed.
# To upgrade a package: take the new release asset URL and its digest (the release page lists it,
# or `gh release view <tag> --repo vale-cli/<pkg> --json assets`) and change both together.

StylesPath = .vale/styles
# Warnings and errors by default; add --minAlertLevel=suggestion for every hint.
MinAlertLevel = warning
Vocab = Contractum

Packages = https://github.com/vale-cli/google/releases/download/v0.7.2/Google.zip#sha256:c1f61ae1c4cee3f2c2ffb2912fbbdff48a02c0e47e114dfd6435b15438171d97, \
  https://github.com/vale-cli/write-good/releases/download/v0.5.0/write-good.zip#sha256:1736c0b61aed16170d5af65f602d776a06dc1a563bc6552abfe5db6940190e22

# ---------------------------------------------------------------------------------------------
# Every Markdown page a reader sees. (Module CLAUDE.md files and .claude/ skills are agent notes,
# not reader docs; the gate never passes them to Vale.)
[*.md]
BasedOnStyles = Vale, Google, write-good, Contractum

# Spelling is checked by typos (uv `docs` group), which knows code identifiers. Vale's
# dictionary speller would duplicate it with many false hits on code-heavy pages.
Vale.Spelling = NO

# Accepted terms keep their casing in prose, but a lowercase identifier outside a code span
# (a compose service name, `cel-2`) is a style slip, not a blocker: put identifiers in code spans.
Vale.Terms = warning

# --- Project conventions that win over the Google style (see the keep-docs-current skill,
# rules/style.md, "Where the guides disagree") ---
# No contractions: the docs write "do not", "cannot" (about 440 uses against 6).
Google.Contractions = NO
# No Oxford comma: the docs write "folders, contracts and actions" (about 215 against 11).
Google.OxfordComma = NO
# Our own Timeless rule replaces Google's: "Latest" is a contract lifecycle state here.
Google.Timeless = NO
# Google's word list is about Google products ("CLI" -> "command-line tool" clashes with our
# "SDK and CLI" page). Our own Jargon rule holds the project word list.
Google.WordList = NO
# Its swaps include admin -> administrator, which clashes with role names (Global admin, Org admin).
Google.WordListCase = suggestion
# ISO dates (2026-11-20) are the project convention for dates in tables and settings.
Google.DateFormat = NO
# Literal values belong in code spans; when prose quotes a UI string the punctuation stays outside.
Google.Quotes = NO
# Future tense is sometimes the clearest way to state a result ("The app will ask you to ...").
# Keep the hint, but as a suggestion.
Google.Will = suggestion
# The page decides when a passive is clearer; write-good already reports passives.
Google.Passive = NO
write-good.Passive = suggestion
# E-Prime (no "to be") is not a goal for reference docs.
write-good.E-Prime = NO
write-good.Adverbs = suggestion
write-good.So = warning
write-good.ThereIs = warning

# Google rules shipped at `error` that are taste or typography, not correctness: lower them so
# only Contractum's precise rules block.
Google.EmDash = warning
Google.Units = warning
Google.Exclamation = warning
Google.Gender = warning
Google.GenderBias = warning
Google.Latin = warning
Google.LyHyphens = warning
Google.OptionalPlurals = warning
Google.Ordinal = warning
Google.Periods = warning
Google.Slang = warning
Google.Spacing = warning
Google.AMPM = warning

# ---------------------------------------------------------------------------------------------
# Generated references: written by scripts/gen_http_reference.py and
# clients/python/scripts/gen_reference.py from the code. Fix the source, never the page.
[docs/user/reference/*.md]
BasedOnStyles =

# The ASVS review is an audit record: it quotes the standard verbatim and cites files and commits.
# Only the precise project rules apply.
[docs/admin/security/*.md]
BasedOnStyles = Contractum
Contractum.SentenceLength = NO
Contractum.Jargon = NO

# Contributor docs define architecture terms (outbox, PDP) on first use; keep them as hints.
[docs/dev/**/*.md]
Contractum.Jargon = suggestion
