# CI for the contractum SDK and CLI (clients/python). The SDK is not a member of the server uv
# workspace: it has its own pyproject.toml and uv.lock, so every job runs from clients/python and
# the server workflow (ci.yml) never sees these files. One aggregate check, `sdk-ok`, is the thing
# branch protection should require. `sdk-integration` runs the real-stack suite against the compose
# test profile and holds the binding D-48 coverage floor (unit plus integration, combined).
name: sdk

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "clients/python/**"
      - "ui/openapi/**"
      - ".github/workflows/sdk.yml"
      - "docs/user/reference/**"
      - "docs/user/sdk-cli.md"
  push:
    branches: [main]
    paths:
      - "clients/python/**"
      - "ui/openapi/**"
      - ".github/workflows/sdk.yml"
      - "docs/user/reference/**"
      - "docs/user/sdk-cli.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: clients/python

jobs:
  sdk-lint:
    name: sdk-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock
      - name: Install Python from .python-version
        run: uv python install
      - name: uv lock --check
        run: uv lock --check
      - name: uv sync --frozen
        run: uv sync --frozen --all-extras
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: lint-imports
        run: uv run lint-imports --config pyproject.toml
      - name: generated client is up to date
        run: uv run python scripts/generate_client.py --check
      - name: reference pages are up to date
        run: uv run python scripts/gen_reference.py --check

  sdk-unit:
    name: sdk-unit (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock
      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: uv sync --frozen
        run: uv sync --frozen --all-extras --python ${{ matrix.python }}
      - name: Unit tests
        run: uv run --no-sync pytest -m unit -q

  sdk-os:
    name: sdk-os (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: uv sync --frozen
        run: uv sync --frozen --all-extras --python 3.13
      - name: Unit tests
        run: uv run --no-sync pytest -m unit -q

  # Proves the lower bounds of the dependency ranges (D-03): resolve every direct dependency to
  # its lowest allowed version on the oldest supported Python. The lock rewrite stays on the runner.
  sdk-lowest:
    name: sdk-lowest (python 3.11, lowest-direct)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: uv sync --resolution lowest-direct
        run: uv sync --resolution lowest-direct --all-extras --python 3.11
      - name: Unit tests
        run: uv run --no-sync pytest -m unit -q

  # Proves the newest releases the ranges allow (D-44): a fresh resolution outside the lock on the
  # newest supported Python.
  sdk-latest:
    name: sdk-latest (python 3.14, newest releases)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Create a fresh environment with the newest allowed releases
        run: |
          uv venv --python 3.14 .venv-latest
          uv pip install --python .venv-latest -e ".[all]" --group dev
      - name: Unit tests
        run: .venv-latest/bin/python -m pytest -m unit -q

  # Unit-only coverage floor: an extra, labelled as such. The binding D-48 floor is the combined
  # unit plus integration figure that `sdk-integration` below measures.
  sdk-unit-coverage:
    name: sdk-unit-coverage (unit-only floor, extra to the D-48 combined floor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: uv sync --frozen
        run: uv sync --frozen --all-extras --python 3.13
      - name: Erase old coverage data
        run: uv run --no-sync coverage erase
      - name: Unit tests under coverage
        run: uv run --no-sync coverage run -m pytest -m unit -q
      - name: Combine coverage data
        run: uv run --no-sync coverage combine
      - name: Coverage floor (unit-only, 98 percent)
        run: uv run --no-sync coverage report --fail-under=98

  # The D-48 floor: the integration suite against the real stack (compose test profile, D-41) with
  # unit and integration coverage combined, 98 percent minimum. `sdk-unit-coverage` stays as the
  # labelled unit-only extra. It never prints `.dev`: the three IT variables only name files.
  sdk-integration:
    name: sdk-integration (real stack, combined coverage floor)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker system prune -af
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: uv sync --frozen
        run: uv sync --frozen --all-extras --python 3.13
      # compose.test.yaml bind-mounts ./ui/test-results (the source is not created), and a
      # runner-owned .dev makes dev-init chown its mirror files to the runner user.
      - name: Prepare bind-mount directories
        working-directory: .
        run: mkdir -p .dev ui/test-results
      # No --profile test on up: the e2e and ui-e2e services are one-shot runners of the server suite.
      - name: Start the stack
        working-directory: .
        run: docker compose -f compose.yaml -f compose.test.yaml up -d --build --wait --wait-timeout 600
      - name: Smoke test (bootstraps the admin password)
        working-directory: .
        run: bash scripts/skeleton-smoke.sh
      - name: Integration suite with the combined coverage floor
        working-directory: .
        env:
          CONTRACTUM_IT_URL: https://localhost:8443
          CONTRACTUM_IT_CA: ${{ github.workspace }}/.dev/ca.crt
          CONTRACTUM_IT_ADMIN_PASSWORD_FILE: ${{ github.workspace }}/.dev/admin_password
        run: bash clients/python/scripts/combined_coverage.sh --require-integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sdk-coverage-${{ github.run_id }}
          path: clients/python/coverage.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Collect compose diagnostics
        if: failure()
        working-directory: .
        run: |
          mkdir -p sdk-artifacts
          docker compose -f compose.yaml -f compose.test.yaml --profile test ps -a > sdk-artifacts/compose-ps.txt 2>&1 || true
          docker compose -f compose.yaml -f compose.test.yaml --profile test logs --no-color --timestamps > sdk-artifacts/compose-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: sdk-integration-failure-${{ github.run_id }}
          path: sdk-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down the stack
        if: always()
        working-directory: .
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test down -v --remove-orphans

  sdk-ok:
    name: sdk-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [sdk-lint, sdk-unit, sdk-os, sdk-lowest, sdk-latest, sdk-unit-coverage, sdk-integration]
    if: always()
    steps:
      - name: Summarise the results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "sdk failed: at least one job did not succeed" >&2
              exit 1
            fi
          done
