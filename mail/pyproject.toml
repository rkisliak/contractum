[project]
name = "dc-mail"
version = "0.1.0"
description = "Mail service: sends notification email over SMTP"
requires-python = ">=3.13,<3.15"
dependencies = [
  "dc-core",
  "dc-auth",
]

[tool.uv.sources]
dc-core = { workspace = true }
dc-auth = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
