<rect x="380.0" y="440" width="160" height="56" rx="12" fill="#7C3AED" fill-opacity="0.1" stroke="#7C3AED" stroke-width="2"/>
<text x="460.0" y="464.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Team: Close</text>
<text x="460.0" y="482.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">inherited</text>
<rect x="380.0" y="440" width="160" height="56" rx="12" fill="none" stroke="#7C3AED" stroke-width="4" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.530;0.570;0.690;1" values="0;0;1;0;0"/></rect>
<rect x="790.0" y="440" width="160" height="56" rx="12" fill="#94A3B8" fill-opacity="0.05" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="870.0" y="464.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Team: Web</text>
<text x="870.0" y="482.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">no access</text>
<rect x="40" y="112" width="200" height="56" rx="12" fill="#7C3AED" fill-opacity="0.18" stroke="#7C3AED" stroke-width="2"/>
<text x="140.0" y="136.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">grant</text>
<text x="140.0" y="154.0" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">org_admin → finance-admins</text>
<path d="M140,168 L230,205" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-7C3AED)"/>
<circle cx="52" cy="112" r="13" fill="#7C3AED"/>
<text x="52" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
<path d="M430,214 C560,170 640,170 770,214" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="7 5"/>
<text x="600" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">✕  never sideways</text>
<path d="M300,200 C300,150 420,128 508,128" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="7 5"/>
<text x="392" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">✕  never upward</text>
