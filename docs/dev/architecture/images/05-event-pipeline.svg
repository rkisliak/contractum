<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">Audit event pipeline</title>
  <desc id="d">A producing service writes its domain row and outbox row in one transaction. The outbox relay publishes to the AUDIT stream in NATS JetStream; contracts publishes access events from an in-memory queue to the ACCESS stream. The audit service consumes both streams and stores events in audit_event. A reader queries through the gateway. Change events are amber, denial events red, access events blue, the query indigo.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <path id="pChange" d="M150,170 L150,300 L320,300 L500,300 L540,300 L540,200 L580,200 L770,200 L840,200 L930,200 L930,320"/>
    <path id="pAccess" d="M260,135 L290,135 L290,400 L320,400 L500,400 L580,400 L770,400 L810,400 L810,230 L930,230 L930,320"/>
    <path id="pQuery" d="M1115,320 L1115,200 L1060,200 L1020,200 L960,200 L960,320"/>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0F172A; }
    .h { font-size: 16px; font-weight: 600; }
    .t { font-size: 14px; }
    .s { font-size: 13px; fill: #334155; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .flow { fill: none; stroke: #94A3B8; stroke-width: 2; marker-end: url(#arr); }
    .badge circle { fill: #0F172A; }
    .badge text { fill: #FFFFFF; font-size: 14px; font-weight: 700; text-anchor: middle; }
  </style>

  <rect x="0" y="0" width="1200" height="640" fill="#FFFFFF"/>
  <text x="40" y="44" class="h" style="font-size:20px">How an audit event travels</text>
  <text x="40" y="70" class="s">Steps ① to ⑤ match the numbered list on the page.</text>

  <!-- producing service -->
  <rect x="40" y="100" width="220" height="70" rx="12" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="2"/>
  <text x="150" y="128" class="h" text-anchor="middle">Service handler</text>
  <text x="150" y="150" class="s" text-anchor="middle">identity · contracts · validation</text>

  <!-- service database -->
  <rect x="40" y="210" width="220" height="140" rx="12" fill="#475569" fill-opacity="0.1" stroke="#475569" stroke-width="2"/>
  <text x="150" y="234" class="t" text-anchor="middle" font-weight="600">service database</text>
  <rect x="60" y="246" width="180" height="30" rx="6" fill="#FFFFFF" stroke="#475569"/>
  <text x="150" y="266" class="t" text-anchor="middle">domain row</text>
  <rect x="60" y="286" width="180" height="30" rx="6" fill="#FFFFFF" stroke="#475569"/>
  <text x="150" y="306" class="t" text-anchor="middle">outbox row</text>
  <text x="150" y="338" class="s" text-anchor="middle">one transaction</text>

  <!-- relay -->
  <rect x="320" y="268" width="180" height="64" rx="12" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="2"/>
  <text x="410" y="294" class="t" text-anchor="middle" font-weight="600">outbox relay</text>
  <text x="410" y="316" class="s" text-anchor="middle">SKIP LOCKED · Nats-Msg-Id</text>

  <!-- access queue -->
  <rect x="320" y="370" width="180" height="64" rx="12" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="2"/>
  <text x="410" y="396" class="t" text-anchor="middle" font-weight="600">access log queue</text>
  <text x="410" y="418" class="s" text-anchor="middle">contracts · drop oldest</text>

  <!-- NATS -->
  <rect x="560" y="100" width="230" height="370" rx="12" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-width="2"/>
  <text x="675" y="128" class="h" text-anchor="middle">NATS JetStream</text>
  <rect x="580" y="150" width="190" height="100" rx="8" fill="#FFFFFF" stroke="#16A34A"/>
  <text x="675" y="178" class="t" text-anchor="middle" font-weight="600">stream AUDIT</text>
  <text x="675" y="200" class="mono" text-anchor="middle">audit.&gt;</text>
  <text x="675" y="222" class="s" text-anchor="middle">kept · 120 s dedupe</text>
  <rect x="580" y="350" width="190" height="100" rx="8" fill="#FFFFFF" stroke="#16A34A"/>
  <text x="675" y="378" class="t" text-anchor="middle" font-weight="600">stream ACCESS</text>
  <text x="675" y="400" class="mono" text-anchor="middle">access.&gt;</text>
  <text x="675" y="422" class="s" text-anchor="middle">7 days · 1 GiB · discard old</text>

  <!-- audit service -->
  <rect x="840" y="150" width="180" height="100" rx="12" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-width="2"/>
  <text x="930" y="176" class="h" text-anchor="middle">audit service</text>
  <text x="930" y="198" class="s" text-anchor="middle">audit-writer</text>
  <text x="930" y="216" class="s" text-anchor="middle">audit-access-writer</text>
  <text x="930" y="236" class="s" text-anchor="middle">unique event_id</text>

  <!-- audit DB -->
  <rect x="840" y="320" width="180" height="80" rx="12" fill="#475569" fill-opacity="0.1" stroke="#475569" stroke-width="2"/>
  <text x="930" y="350" class="t" text-anchor="middle" font-weight="600">audit database</text>
  <text x="930" y="374" class="mono" text-anchor="middle">audit_event</text>
  <text x="930" y="392" class="s" text-anchor="middle">+ audit_dead_letter</text>

  <!-- gateway and reader -->
  <rect x="1060" y="160" width="120" height="80" rx="12" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="2"/>
  <text x="1120" y="196" class="t" text-anchor="middle" font-weight="600">gateway</text>
  <text x="1120" y="216" class="s" text-anchor="middle">Traefik</text>
  <rect x="1060" y="320" width="120" height="80" rx="12" fill="#4F46E5" fill-opacity="0.1" stroke="#4F46E5" stroke-width="2"/>
  <text x="1120" y="354" class="t" text-anchor="middle" font-weight="600">reader</text>
  <text x="1120" y="374" class="s" text-anchor="middle">GET /events</text>

  <!-- static flow lines -->
  <path class="flow" d="M150,170 L150,208"/>
  <path class="flow" d="M240,300 L318,300"/>
  <path class="flow" d="M500,300 L540,300 L540,200 L578,200"/>
  <path class="flow" d="M260,135 L290,135 L290,400 L318,400"/>
  <path class="flow" d="M500,400 L578,400"/>
  <path class="flow" d="M770,200 L838,200"/>
  <path class="flow" d="M770,400 L810,400 L810,232 L838,232"/>
  <path class="flow" d="M930,250 L930,318"/>
  <path class="flow" d="M1120,320 L1120,242"/>
  <path class="flow" d="M1060,200 L1022,200"/>

  <!-- step badges -->
  <g class="badge"><circle cx="40" cy="210" r="14"/><text x="40" y="215">1</text></g>
  <g class="badge"><circle cx="320" cy="268" r="14"/><text x="320" y="273">2</text></g>
  <g class="badge"><circle cx="560" cy="100" r="14"/><text x="560" y="105">3</text></g>
  <g class="badge"><circle cx="840" cy="150" r="14"/><text x="840" y="155">4</text></g>
  <g class="badge"><circle cx="1060" cy="320" r="14"/><text x="1060" y="325">5</text></g>

  <!-- step highlight sequence (10 s loop) -->
  <rect x="34" y="204" width="232" height="152" rx="15" fill="none" stroke="#D97706" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1;0.2;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect x="314" y="262" width="192" height="76" rx="15" fill="none" stroke="#D97706" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2;0.3;0.4;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect x="554" y="94" width="242" height="382" rx="15" fill="none" stroke="#D97706" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.4;0.5;0.6;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect x="834" y="144" width="192" height="262" rx="15" fill="none" stroke="#D97706" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.6;0.7;0.8;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect x="1054" y="154" width="132" height="252" rx="15" fill="none" stroke="#4F46E5" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.8;0.9;1" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- moving events (hidden where animation is not supported) -->
  <circle r="8" fill="#D97706" stroke="#FFFFFF" stroke-width="2" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0s"/>
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto"><mpath href="#pChange"/></animateMotion>
  </circle>
  <circle r="8" fill="#DC2626" stroke="#FFFFFF" stroke-width="2" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0s"/>
    <animateMotion dur="8s" begin="-4s" repeatCount="indefinite"><mpath href="#pChange"/></animateMotion>
  </circle>
  <circle r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0s"/>
    <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#pAccess"/></animateMotion>
  </circle>
  <circle r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0s"/>
    <animateMotion dur="6s" begin="-3s" repeatCount="indefinite"><mpath href="#pAccess"/></animateMotion>
  </circle>
  <circle r="7" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0s"/>
    <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#pQuery"/></animateMotion>
  </circle>

  <!-- legend -->
  <rect x="40" y="500" width="1120" height="110" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="60" y="528" class="t" font-weight="600">Lanes</text>
  <circle cx="70" cy="556" r="8" fill="#D97706"/>
  <text x="86" y="561" class="t">change: outbox → AUDIT → category change (guaranteed)</text>
  <circle cx="530" cy="556" r="8" fill="#DC2626"/>
  <text x="546" y="561" class="t">denial: identity's outbox → audit.identity.authz.check.denied (guaranteed)</text>
  <circle cx="70" cy="588" r="8" fill="#2563EB"/>
  <text x="86" y="593" class="t">access: in-memory queue → ACCESS → category access (best effort)</text>
  <circle cx="530" cy="588" r="8" fill="#4F46E5"/>
  <text x="546" y="593" class="t">query: reader → gateway → audit, rows trimmed to folders with audit:query</text>
</svg>
