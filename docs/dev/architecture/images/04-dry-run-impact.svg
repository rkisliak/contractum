<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Rule-set dry run</title>
<desc id="d">A Policy Manager asks contracts for a dry run. Contracts learns the rule set folder from validation, lists a keyset page of published contracts, and sends their Latest documents to the validation batch route with the caller token. Validation checks every item folder with identity, evaluates each document as if the rule set were enforced, and returns value-free verdicts. Contracts filters names and pointers by the caller scope, writes one counts-only audit event and returns the page with a next cursor.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#0F172A">Rule dry run: what would this rule set block?</text>
<text x="40" y="66" font-size="14" fill="#475569">Paged and synchronous. Each Latest version is evaluated as if the version were enforced. Nothing is stored and no notice is sent.</text>
