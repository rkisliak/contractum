<text x="664" y="434" font-size="13" fill="#475569" font-weight="400" text-anchor="start">smaller pool than the workers,</text>
<text x="664" y="452" font-size="13" fill="#475569" font-weight="400" text-anchor="start">so publishes are never starved</text>
<text x="664" y="474" font-size="13" fill="#475569" font-weight="400" text-anchor="start">run slot per document only</text>
