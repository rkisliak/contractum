<text x="40" y="42" font-size="22" font-weight="700" fill="#0F172A">Mandatory inheritance: which rule sets apply where</text>
<text x="40" y="66" font-size="14" fill="#475569">A mandatory set applies to its folder and everything below. Lower levels can only add. Mode is computed from enforce_at at each run.</text>
