<circle r="6" fill="#DC2626" stroke="#FFFFFF" stroke-width="2" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0.0000;0.0000;1.0000;1.0000" keyTimes="0.0000;0.6000;0.7200;1.0000" path="M430,214 L430,214 L600,182 L600,182"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.000;0.600;0.605;0.780;0.800;1.000" values="0;0;1;1;0;0"/></circle>
<rect x="40" y="520" width="1120" height="104" rx="12" fill="#94A3B8" fill-opacity="0.05" stroke="#94A3B8" stroke-width="2"/>
<text x="600.0" y="577.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A"></text>
<circle cx="64" cy="541" r="9" fill="#7C3AED"/>
<text x="64" y="545" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
<text x="84" y="546" text-anchor="start" font-size="13" font-weight="400" fill="#0F172A">A role is granted on one folder, to a user, a group or a machine identity. Each role may only be granted at its own level.</text>
<circle cx="64" cy="563" r="9" fill="#7C3AED"/>
<text x="64" y="567" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
<text x="84" y="568" text-anchor="start" font-size="13" font-weight="400" fill="#0F172A">It applies to that folder and every folder below it. The Finance admins manage Payments, Ledger and their Teams.</text>
<circle cx="64" cy="585" r="9" fill="#DC2626"/>
<text x="64" y="589" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
<text x="84" y="590" text-anchor="start" font-size="13" font-weight="400" fill="#0F172A">It never reaches a parent or a sibling. Marketing stays invisible: its folders answer 404, as if they did not exist.</text>
<text x="64" y="612" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">■</text>
<text x="84" y="612" text-anchor="start" font-size="13" font-weight="400" fill="#475569">A block flag on an Organization or Team cuts grants made above it (except Global admin). Grants at or below it still apply.</text>
</svg>
