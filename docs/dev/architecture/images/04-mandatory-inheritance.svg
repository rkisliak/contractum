<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Mandatory rule sets apply down the folder tree</title>
<desc id="d">Platform rule sets apply to every folder. A mandatory set at the Organization applies to both Projects and all Teams. A mandatory set at Project A applies only under Project A, with version 1 enforced and version 2 in warn. Team A2 adds an attached set. Each Team box lists the effective rule sets with enforce or warn mode.</desc>
