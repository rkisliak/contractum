<path d="M480,259 C504,259 510,266 510,280 L510,330 C510,340 518,345 535,345 L780,345 C850,345 840,400 900,400" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<path d="M900,215 C870,215 870,480 800,480" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
