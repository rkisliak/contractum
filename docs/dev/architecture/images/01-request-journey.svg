<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The life of one API request</title>
<desc id="d">Eight numbered steps: TLS at Traefik, gateway checks and rate limit, routing to the service, token authentication, the PDP check at identity, the handler writing the domain row and the outbox row in one transaction, the response, and the relay publishing the event to NATS where the audit service stores it.</desc>
